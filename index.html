<script>
/* ==== data.js ==== */
/* ==========================================================================
   ANALYSIS LAYER — kept separate from presentation (charts.js / sections.js).
   Consumes only the anonymised aggregate cube produced by scripts/build_data.py.

   Cube structure (one object per filter cell, NOT per respondent):
     L    0 = full granularity (kabupaten + kecamatan), non-sensitive indicators
          1 = coarse (kabupaten only), sensitive indicators
     g    respondent group  kab/kec  place   d date  o organisation  m method
     c    product categories assessed at that interview
     n    number of records in the cell
     v    {indicatorId: [count per option, ... (+ denominator slot for multi)]}
     num  {indicatorId: [valid numeric values]}
     pair {indicatorId: [ratio current/baseline per respondent]}
   ========================================================================== */
const DATA = { meta: null, cells: [], ind: {}, dq: null, ready: false };

const F = {                       // active filter state
  kab: [], kec: [], grp: [], org: [], cat: [], mth: []
};

/* dq_report.json is no longer fetched: the methodology page it fed has been
   removed from the dashboard. The file still ships in data/ as the audit
   trail, and docs/METHODOLOGY.md documents it, but the browser no longer
   downloads 53 KB it cannot show. */
async function loadData() {
  if (typeof window !== 'undefined' && window.__JMA_EMBEDDED__) {
    const meta = window.__JMA_EMBEDDED__['./data/meta.json'];
    const cube = window.__JMA_EMBEDDED__['./data/cube.json'];
    const inds = window.__JMA_EMBEDDED__['./data/indicators.json'];
    if (meta && cube && inds) {
      DATA.meta = meta;
      DATA.cells = cube.cells;
      DATA.formulas = inds.formulas;
      inds.indicators.forEach(i => { DATA.ind[i.id] = i; });
      DATA.ready = true;
      return;
    }
  }

  const safeJson = async (url) => {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status} fetching ${url}`);
    const ct = r.headers ? r.headers.get('content-type') : '';
    if (ct && !ct.includes('json')) {
      throw new Error(`Expected JSON from ${url}, received ${ct}`);
    }
    return r.json();
  };

  const [meta, cube, inds] = await Promise.all([
    safeJson('./data/meta.json'),
    safeJson('./data/cube.json'),
    safeJson('./data/indicators.json')
  ]);
  DATA.meta = meta;
  DATA.cells = cube.cells;
  DATA.formulas = inds.formulas;
  inds.indicators.forEach(i => { DATA.ind[i.id] = i; });
  DATA.ready = true;
}

/* ---------------------------------------------------------------- filtering */
const anyOf = (sel, v) => !sel.length || sel.includes(v);

function cellMatch(c) {
  if (!anyOf(F.kab, c.kab)) return false;
  if (F.kec.length && !(c.L === 0 && F.kec.includes(c.kec))) return false;
  if (!anyOf(F.grp, c.g)) return false;
  if (!anyOf(F.org, c.o)) return false;
  if (!anyOf(F.mth, c.m)) return false;
  if (F.cat.length && !F.cat.some(x => c.c.includes(x))) return false;
  return true;
}

/** Filtered cells for a given layer. Sensitive indicators live in layer 1,
 *  which carries no kecamatan, so a kecamatan filter makes them unavailable. */
function cellsFor(layer) { return DATA.cells.filter(c => c.L === layer && cellMatch(c)); }

const filtersActive = () =>
  F.kab.length || F.kec.length || F.grp.length || F.org.length || F.cat.length || F.mth.length;

/* ---------------------------------------------------------------- counts */
function recordCount(group) {
  return cellsFor(0).reduce((s, c) => s + (!group || c.g === group ? c.n : 0), 0);
}
function recordsByGroup() {
  const o = {};
  Object.keys(DATA.meta.records_by_group).forEach(g => { o[g] = recordCount(g); });
  return o;
}
function countBy(dim, group) {
  const o = {};
  cellsFor(0).forEach(c => {
    if (group && c.g !== group) return;
    if (dim === 'cat') { c.c.forEach(x => { o[x] = (o[x] || 0) + c.n; }); return; }
    const k = { kab: c.kab, kec: c.kec, org: c.o, mth: c.m, grp: c.g, date: c.d }[dim];
    if (k !== undefined && k !== '') o[k] = (o[k] || 0) + c.n;
  });
  return o;
}

/* ---------------------------------------------------------------- indicators
   Every result carries its own denominator and sample size. Missing values are
   never counted as "No": blanks simply never enter the option counts, and the
   applicable base is reported alongside so the gap stays visible.            */

const SUP = () => DATA.meta.thresholds.suppress_below;   // 5
const CAU = () => DATA.meta.thresholds.caution_below;    // 10

/** Single-select and multi-select results. */
function result(id) {
  const s = DATA.ind[id];
  if (!s) return { error: 'unknown' };
  if (!s.published) return { blocked: true, spec: s };
  if (s.sensitive && F.kec.length) return { sdc: true, spec: s };

  const layer = s.sensitive ? 1 : 0;
  const cells = cellsFor(layer).filter(c => c.g === s.group);
  const base = cells.reduce((a, c) => a + c.n, 0);      // applicable respondents
  const k = s.options.length;

  if (s.kind === 'cat') {
    const counts = new Array(k).fill(0);
    cells.forEach(c => (c.v[id] || []).forEach((v, j) => { counts[j] += v; }));
    const valid = counts.reduce((a, b) => a + b, 0);
    const nonsubN = s.options.reduce((a, o, j) =>
      a + (s.excluded_responses.includes(o) ? counts[j] : 0), 0);
    return pack(s, counts, valid, base, nonsubN, false);
  }

  if (s.kind === 'multi') {
    const counts = new Array(k).fill(0); let denom = 0;
    cells.forEach(c => {
      const a = c.v[id]; if (!a) return;
      for (let j = 0; j < k; j++) counts[j] += a[j];
      denom += a[k];                                    // respondents answering the block
    });
    return pack(s, counts, denom, base, 0, true);
  }
  return { error: 'kind' };
}

function pack(s, counts, valid, base, nonsubN, isMulti) {
  /* Suppression below n=5 protects individuals. NGO respondents are
     organisations answering about their own programme plans, so the rule there
     is the one the brief sets for very small subgroups: report absolute counts
     and drop percentages, rather than hide the page. */
  const countsOnly = s.group === 'NGO';
  const rows = s.options.map((o, j) => ({
    key: o, label: tOpt(o), n: counts[j],
    pct: valid ? (100 * counts[j] / valid) : null,
    tone: tone(s, o)
  }));
  const headline = s.numerator.startsWith('Responden yang memilih')
    ? rows.filter(r => headlineKeys(s).includes(r.key)).reduce((a, r) => a + r.n, 0)
    : null;
  return {
    spec: s, rows, valid, base, nonsub: nonsubN, isMulti, countsOnly,
    headline, headlinePct: headline !== null && valid ? 100 * headline / valid : null,
    missing: base - valid,
    suppressed: !countsOnly && valid > 0 && valid < SUP(),
    caution: valid > 0 && valid < CAU(),
    empty: valid === 0
  };
}

function headlineKeys(s) {
  const m = s.numerator.match(/^Responden yang memilih: (.*)$/);
  return m ? m[1].split(', ') : [];
}

/** Semantic colour per response option, driven by the registry's pos/neg sets
 *  encoded into numerator text and the non-substantive list. */
const NEG_WORDS = ['Tidak', 'Turun', 'Berhenti', 'Belum Ada', 'Tidak Tersedia', 'Tutup',
  'Tidak Berfungsi', 'Tidak Ada', 'Sebagian Hilang/Rusak', 'Ruang Terbuka', 'Pengungsian Kolektif'];
function tone(s, opt) {
  if (s.excluded_responses.includes(opt)) return 'missing';
  if (headlineKeys(s).includes(opt)) return 'ok';
  if (opt === 'Tidak' || opt === 'Tidak Berfungsi' || opt === 'Tutup' || opt === 'Tidak Tersedia') return 'crit';
  if (NEG_WORDS.some(w => opt === w)) return 'crit';
  if (/Sebagian|Kesulitan|Kadang|Terbatas|Syarat|Penyesuaian|Mungkin/.test(opt)) return 'caution';
  return 'info';
}

/** Numeric distribution: median + IQR, outliers already excluded at build time. */
function stats(id) {
  const s = DATA.ind[id];
  if (!s) return { error: 'unknown' };
  if (!s.published) return { blocked: true, spec: s };
  if (s.sensitive && F.kec.length) return { sdc: true, spec: s };
  const cells = cellsFor(s.sensitive ? 1 : 0).filter(c => c.g === s.group);
  const base = cells.reduce((a, c) => a + c.n, 0);
  const v = [];
  cells.forEach(c => (c.num[id] || []).forEach(x => v.push(x)));
  v.sort((a, b) => a - b);
  const q = p => {
    if (!v.length) return null;
    const i = (v.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
    return v[lo] + (v[hi] - v[lo]) * (i - lo);
  };
  return {
    spec: s, base, n: v.length, values: v,
    median: q(.5), q1: q(.25), q3: q(.75), min: v[0] ?? null, max: v[v.length - 1] ?? null,
    missing: base - v.length,
    suppressed: v.length > 0 && v.length < SUP(), caution: v.length > 0 && v.length < CAU(),
    empty: v.length === 0
  };
}

/** Before/after pairs: direction split plus median per-respondent change.
 *  ratio = current / baseline, so change% = (ratio - 1) x 100.
 *  Only valid WITHIN a respondent — never aggregated as a price level. */
function pairStats(id) {
  const s = DATA.ind[id];
  if (!s) return { error: 'unknown' };
  if (!s.published) return { blocked: true, spec: s };
  const cells = cellsFor(0).filter(c => c.g === s.group);
  const base = cells.reduce((a, c) => a + c.n, 0);
  const r = [];
  cells.forEach(c => (c.pair[id] || []).forEach(x => r.push(x)));
  r.sort((a, b) => a - b);
  const up = r.filter(x => x > 1).length, same = r.filter(x => x === 1).length, down = r.filter(x => x < 1).length;
  const med = r.length ? r[Math.floor((r.length - 1) / 2)] : null;
  return {
    spec: s, base, n: r.length, up, same, down,
    medianRatio: med, medianPct: med === null ? null : (med - 1) * 100,
    missing: base - r.length,
    suppressed: r.length > 0 && r.length < SUP(), caution: r.length > 0 && r.length < CAU(),
    empty: r.length === 0
  };
}

/* ---------------------------------------------------------------- export */
function filterLabel() {
  if (!filtersActive()) return t('nofilter');
  const p = [];
  if (F.kab.length) p.push(`${t('f_kab')}: ${F.kab.join(', ')}`);
  if (F.kec.length) p.push(`${t('f_kec')}: ${F.kec.join(', ')}`);
  if (F.grp.length) p.push(`${t('f_grp')}: ${F.grp.map(g => DATA.meta.group_labels[g][LANG] || g).join(', ')}`);
  if (F.org.length) p.push(`${t('f_org')}: ${F.org.join(', ')}`);
  if (F.cat.length) p.push(`${t('f_cat')}: ${F.cat.map(tOpt).join(', ')}`);
  if (F.mth.length) p.push(`${t('f_mth')}: ${F.mth.map(tOpt).join(', ')}`);
  return p.join(' · ');
}

/** CSV for a single indicator under the active filter. Aggregates only. */
function indicatorCSV(id) {
  const s = DATA.ind[id];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const L = [['indicator_id', 'label', 'respondent_group', 'option', 'count', 'denominator',
    'percent', 'applicable_base', 'missing'].join(',')];
  if (!s) return L.join('\n');
  if (s.kind === 'cat' || s.kind === 'multi') {
    const r = result(id);
    if (r.rows) {
      r.rows.forEach(row => L.push([id, q(s.label_id), s.group, q(row.key), row.n, r.valid,
        row.pct === null ? '' : row.pct.toFixed(1), r.base, r.missing].join(',')));
    }
  } else if (s.kind === 'num') {
    const st = stats(id);
    if (!st.empty) L.push([id, q(s.label_id), s.group, 'median', st.median, st.n, '', st.base, st.missing].join(','));
  } else {
    const p = pairStats(id);
    if (!p.empty) {
      [['up', p.up], ['same', p.same], ['down', p.down]].forEach(([k, v]) =>
        L.push([id, q(s.label_id), s.group, k, v, p.n, (100 * v / p.n).toFixed(1), p.base, p.missing].join(',')));
    }
  }
  L.push('');
  L.push(q('Filter aktif: ' + filterLabel()));
  L.push(q('Penyebut: ' + s.denominator));
  return L.join('\n');
}

/** CSV of every published indicator under the active filter. Aggregates only. */
function buildCSV() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const L = [['indicator_id', 'label', 'respondent_group', 'kind', 'option', 'count',
    'denominator', 'percent', 'applicable_base', 'missing', 'note'].join(',')];
  Object.values(DATA.ind).forEach(s => {
    if (!s.published) {
      L.push([s.id, q(s.label_id), s.group, s.kind, '', '', '', '', '', '', q('TIDAK DIPUBLIKASIKAN: ' + s.limitations_id)].join(','));
      return;
    }
    if (s.kind === 'cat' || s.kind === 'multi') {
      const r = result(s.id);
      if (r.sdc) { L.push([s.id, q(s.label_id), s.group, s.kind, '', '', '', '', '', '', q('SDC: butuh agregasi kabupaten')].join(',')); return; }
      r.rows.forEach(row => L.push([s.id, q(s.label_id), s.group, s.kind, q(row.key), row.n, r.valid,
        row.pct === null ? '' : row.pct.toFixed(1), r.base, r.missing,
        q(r.suppressed ? `n<${SUP()} disuppress` : (r.caution ? `n<${CAU()} hati-hati` : ''))].join(',')));
    } else if (s.kind === 'num') {
      const st = stats(s.id);
      if (st.empty || st.sdc) return;
      L.push([s.id, q(s.label_id), s.group, s.kind, 'median', st.median, st.n, '', st.base, st.missing, q(`IQR ${st.q1}–${st.q3}; ${s.unit}`)].join(','));
    } else {
      const p = pairStats(s.id);
      if (p.empty) return;
      ['up:' + p.up, 'same:' + p.same, 'down:' + p.down].forEach(x => {
        const [k, v] = x.split(':');
        L.push([s.id, q(s.label_id), s.group, s.kind, k, v, p.n, (100 * v / p.n).toFixed(1), p.base, p.missing,
          q(`median change ${p.medianPct === null ? '' : p.medianPct.toFixed(1) + '%'}`)].join(','));
      });
    }
  });
  L.push('');
  L.push(q('Filter aktif: ' + filterLabel()));
  L.push(q('Dibuat: ' + new Date().toISOString() + ' · Build data: ' + DATA.meta.generated_at));
  L.push(q('Hanya agregat anonim. Persentase multi-jawaban dapat melebihi 100%.'));
  return L.join('\n');
}

</script>
<script>
/* ==== charts.js ==== */
/* ==========================================================================
   PRESENTATION LAYER — reusable chart components.

   Charts are built from HTML and CSS, not from stretched SVG. An earlier
   version used <svg viewBox="0 0 100 H" preserveAspectRatio="none">, which
   scales the x and y axes independently: at 1200px wide the x axis stretched
   about 12x while the y axis stretched 2.4x, so every text node inside the SVG
   was distorted and labels collided. Percentage-width HTML has no such failure
   mode, stays crisp at any viewport, reflows on mobile, and is selectable and
   readable by screen readers.

   Every chart carries: title, indicator definition, numerator, denominator,
   sample size, active filter context, source fields, missing-value note, unit,
   small-sample warning, accessible label and a table alternative.
   ========================================================================== */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const C = tone => `var(--c-${tone === 'ok' ? 'ok' : tone === 'crit' ? 'crit' : tone === 'caution' ? 'caution' : tone === 'missing' ? 'missing' : 'info'})`;
const fmt = (v, d = 1) => v === null || v === undefined || Number.isNaN(v) ? '–' :
  Number(v).toLocaleString(LANG === 'en' ? 'en-GB' : 'id-ID', { maximumFractionDigits: d, minimumFractionDigits: 0 });
const pc = v => v === null ? '–' : fmt(v, 1) + '%';

/* ------------------------------------------------------------- card */
/* Each chart carries its own traceability: definition, numerator, denominator,
   sample size, unit, missing-value treatment, source fields, active filter and
   limitations. It sits behind a toggle so the figures stay in front. */
function metaBlock(r) {
  const s = r.spec;
  const nText = r.valid !== undefined ? `${r.valid} ${t('valid')} / ${r.base} ${t('resp')}`
    : (r.n !== undefined ? `${r.n} / ${r.base} ${t('resp')}` : '–');
  return `<details class="meta"><summary>${t('detail')}</summary><dl>
    <dt>${t('def')}</dt><dd>${esc(LANG === 'en' ? s.label_en : s.label_id)}</dd>
    <dt>${t('numer')}</dt><dd>${esc(s.numerator)}</dd>
    <dt>${t('denom')}</dt><dd>${esc(s.denominator)}</dd>
    <dt>${t('n')}</dt><dd>${nText}</dd>
    <dt>${t('miss')}</dt><dd>${r.missing === undefined ? '–' : `${r.missing} ${LANG === 'en' ? 'blank, never counted as “No”' : 'kosong, tidak pernah dihitung sebagai “Tidak”'}`}${r.nonsub ? ` · ${r.nonsub} ${t('nonsub')}` : ''}</dd>
    ${s.unit ? `<dt>${t('unit')}</dt><dd>${esc(tUnit(s.unit))}</dd>` : ''}
    <dt>${t('src')}</dt><dd><code>${s.source_fields.map(esc).join(' · ')}</code></dd>
    <dt>${t('filt')}</dt><dd>${esc(filterLabel())}</dd>
    <dt>${t('limit')}</dt><dd lang="id">${esc(s.limitations_id)}</dd>
    <dt>${t('proc')}</dt><dd>${s.last_processed} · ${s.group}</dd>
  </dl></details>`;
}

/** Per-chart CSV download. Serialises only the aggregate rows already on screen. */
function dlBtn(id) {
  return `<button type="button" class="ic-btn" data-dl="${esc(id)}"
    title="${t('dlChart')}" aria-label="${t('dlChart')}">
    <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
  </button>`;
}
/* Status is never carried by colour alone: every flag pairs a glyph with text. */
const FLAG_ICON = {
  alert: '<path d="M12 4.5 2.8 20h18.4z"/><path d="M12 10v4.5M12 17.2v.1"/>',
  stop: '<circle cx="12" cy="12" r="8.6"/><path d="M8.4 12h7.2"/>',
  help: '<circle cx="12" cy="12" r="8.6"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.3M12 17.1v.1"/>',
  check: '<circle cx="12" cy="12" r="8.6"/><path d="M8.4 12.4l2.4 2.4 4.8-5.2"/>',
  shield: '<path d="M12 3.6 5.6 6.2v5.2c0 4.3 2.8 6.9 6.4 7.8 3.6-.9 6.4-3.5 6.4-7.8V6.2z"/>',
  info: '<circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.4M12 7.9v.1"/>'
};
const icoFlag = k => `<svg viewBox="0 0 24 24" class="ic-xs" aria-hidden="true">${FLAG_ICON[k] || FLAG_ICON.info}</svg>`;

function flags(r) {
  const f = [];
  if (r.suppressed) f.push(`<span class="flag crit">${icoFlag('stop')}n&lt;${SUP()}</span>`);
  else if (r.caution) f.push(`<span class="flag warn">${icoFlag('alert')}n&lt;${CAU()}</span>`);
  return f.join(' ');
}

function nline(r, extra) {
  const bits = [];
  if (r.valid !== undefined) bits.push(`${r.valid} ${t('valid')}`);
  else if (r.n !== undefined) bits.push(`n=${r.n}`);
  if (r.isMulti) bits.push(t('multi'));
  if (r.countsOnly) bits.push(LANG === 'en' ? 'absolute counts' : 'jumlah absolut');
  if (extra) bits.push(extra);
  return bits.join(' · ');
}

function card(r, title, sub, body, tableFn) {
  if (r.error) return '';
  if (r.blocked) return `<div class="card chart-card" data-reveal>
    <div class="card-hd"><h3>${esc(title)} <span class="flag crit">${icoFlag('stop')}${t('blocked')}</span></h3></div>
    <div class="state state-block"><p lang="id">${esc(r.spec.limitations_id)}</p></div>
    <div class="card-ft">${metaBlock(r)}</div></div>`;
  if (r.sdc) return `<div class="card chart-card" data-reveal>
    <div class="card-hd"><h3>${esc(title)} <span class="flag method">${icoFlag('shield')}SDC</span></h3></div>
    <div class="state state-sdc"><p>${t('sdcBlocked')}</p></div></div>`;
  if (r.empty) return `<div class="card chart-card" data-reveal>
    <div class="card-hd"><h3>${esc(title)}</h3></div>
    <div class="state state-empty"><p>${t('noData')}</p>
      <p class="state-hint">${t('noDataHint')}</p></div></div>`;
  return `<div class="card chart-card" data-reveal>
    <div class="card-hd">
      <h3>${esc(title)} ${flags(r)}</h3>
      ${r.spec ? dlBtn(r.spec.id) : ''}
    </div>
    ${sub ? `<p class="card-sub">${esc(sub)}</p>` : ''}
    ${r.suppressed ? `<div class="empty-state">${t('suppressed')} — n=${r.valid ?? r.n}</div>` : body}
    <div class="card-ft">
      ${tableFn && !r.suppressed ? `<details class="meta"><summary>${t('tableAlt')}</summary>
        <div class="tbl-wrap">${tableFn()}</div></details>` : ''}
      ${metaBlock(r)}
    </div>
  </div>`;
}

/* ------------------------------------------------------------- KPI */
const KPI_ICON = {
  info: '<circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.4M12 7.9v.1"/>',
  ok: '<circle cx="12" cy="12" r="8.6"/><path d="M8.4 12.4l2.4 2.4 4.8-5.2"/>',
  caution: '<path d="M12 4.5 2.8 20h18.4z"/><path d="M12 10v4.5M12 17.2v.1"/>',
  crit: '<circle cx="12" cy="12" r="8.6"/><path d="M8.4 12h7.2"/>',
  missing: '<circle cx="12" cy="12" r="8.6" stroke-dasharray="3 3"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.3M12 17.1v.1"/>'
};

/** KPI card. `num` carries the raw figure so the reveal animation can count up
 *  to it without ever changing the value that is finally displayed. */
function kpi(label, value, sub, tone = 'info', opts = {}) {
  const tip = opts.tip ? ` <button type="button" class="tip" data-tip="${esc(opts.tip)}"
    aria-label="${esc(t('defOf'))} ${esc(label)}">${icoFlag('info')}</button>` : '';
  const animAttr = opts.num !== undefined && opts.num !== null
    ? ` data-num="${opts.num}" data-fmt="${opts.pct ? 'pct' : 'int'}"` : '';
  return `<div class="card kpi t-${tone}" data-reveal>
    <span class="kpi-top">
      <svg viewBox="0 0 24 24" class="ic kpi-ic" aria-hidden="true">${KPI_ICON[tone] || KPI_ICON.info}</svg>
      <span class="kpi-lab">${esc(label)}${tip}</span>
    </span>
    <span class="kpi-val"${animAttr}>${value}</span>
    <span class="kpi-sub">${esc(sub || '')}</span>
    ${opts.note ? `<span class="kpi-note">${esc(opts.note)}</span>` : ''}
  </div>`;
}

function kpiFrom(id, label, tone) {
  const r = result(id);
  if (r.blocked || r.sdc || r.empty) return kpi(label, '–', r.sdc ? 'SDC' : t('noData'), 'missing');
  const tip = `${r.spec.numerator} ÷ ${r.spec.denominator}`;
  if (r.countsOnly) {
    return kpi(label, fmt(r.headline ?? r.valid, 0),
      `${LANG === 'en' ? 'of' : 'dari'} ${r.valid} ${t('resp')}`, tone || 'missing',
      { tip, num: r.headline ?? r.valid });
  }
  const v = r.headlinePct === null ? null : r.headlinePct;
  const warn = r.caution ? ` · ${t('smallN')}` : '';
  return kpi(label, v === null ? fmt(r.valid, 0) : pc(v),
    `${r.headline ?? r.valid}/${r.valid} ${t('valid')}${warn}`,
    tone || (v === null ? 'info' : v >= 66 ? 'ok' : v >= 40 ? 'caution' : 'crit'),
    { tip, num: v === null ? r.valid : v, pct: v !== null });
}

/* ------------------------------------------------------------- tables */
function rowTable(r) {
  const showPct = !r.countsOnly;
  return `<table class="tbl"><thead><tr><th>${t('option')}</th><th class="num">${t('count')}</th>
    ${showPct ? `<th class="num">${t('pct')}</th>` : ''}</tr></thead><tbody>
    ${r.rows.map(x => `<tr><td>${esc(x.label)}</td><td class="num">${x.n}</td>
      ${showPct ? `<td class="num">${x.pct === null ? '–' : pc(x.pct)}</td>` : ''}</tr>`).join('')}
    <tr><td><b>${t('denom')}</b></td><td class="num"><b>${r.valid}</b></td>
      ${showPct ? '<td class="num">100%</td>' : ''}</tr>
    </tbody></table>`;
}

/* ------------------------------------------------------------- bar charts */
/** Horizontal bars. Widths are percentages of the largest value, so the chart
 *  is width-independent and every label is ordinary text. */
function hbar(id, opts = {}) {
  const r = result(id);
  const s = r.spec || DATA.ind[id];
  const title = opts.title || (LANG === 'en' ? s.label_en : s.label_id);
  if (r.blocked || r.sdc || r.empty) return card(r, title, opts.sub, '', null);

  let rows = r.rows.filter(x => opts.keepZero || x.n > 0);
  if (opts.sort !== false) rows = rows.slice().sort((a, b) => b.n - a.n);
  if (opts.top) rows = rows.slice(0, opts.top);
  const max = Math.max(...rows.map(x => x.n), 1);

  const body = `<div class="bars" role="list" aria-label="${esc(title)}">
    ${rows.map(x => `<div class="bar-row" role="listitem">
      <span class="bar-lab" title="${esc(x.label)}">${esc(x.label)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(100 * x.n / max).toFixed(2)}%;background:${C(x.tone)}"></span></span>
      <span class="bar-val" aria-label="${esc(x.label)}: ${x.n}${r.countsOnly ? '' : ', ' + pc(x.pct)}">${
        r.countsOnly ? `<b>${x.n}</b><span class="bar-n">${LANG === 'en' ? 'of' : 'dari'} ${r.valid}</span>`
                     : `<b>${pc(x.pct)}</b><span class="bar-n">${x.n}</span>`}</span>
    </div>`).join('')}
  </div>`;
  return card(r, title, opts.sub || nline(r), body, () => rowTable(r));
}

/** 100% composition bar for a single-select question. */
function stacked(id, opts = {}) {
  const r = result(id);
  const s = r.spec || DATA.ind[id];
  const title = opts.title || (LANG === 'en' ? s.label_en : s.label_id);
  if (r.blocked || r.sdc || r.empty) return card(r, title, opts.sub, '', null);
  const rows = r.rows.filter(x => x.n > 0);
  const body = `<div class="stack" role="img" aria-label="${esc(title)}: ${esc(rows.map(v => `${v.label} ${v.n}`).join(', '))}">
      ${rows.map(v => {
        const w = 100 * v.n / r.valid;
        return `<span class="seg" style="width:${w.toFixed(2)}%;background:${C(v.tone)}"
          title="${esc(v.label)}: ${v.n}${r.countsOnly ? '' : ` (${pc(v.pct)})`}">${
            w > 12 ? (r.countsOnly ? v.n : Math.round(w) + '%') : ''}</span>`;
      }).join('')}
    </div>
    <div class="legend">${rows.map(v => `<span><i style="background:${C(v.tone)}"></i>${esc(v.label)} · ${v.n}</span>`).join('')}</div>`;
  return card(r, title, opts.sub || nline(r), body, () => rowTable(r));
}

/** Diverging bars: positive options grow left of the centre line, partial and
 *  negative options grow right. Both halves share one scale. */
function diverging(ids, title, sub) {
  const rs = ids.map(id => ({ id, r: result(id) })).filter(x => !x.r.blocked && !x.r.sdc && !x.r.empty);
  if (!rs.length) return `<div class="card"><h3>${esc(title)}</h3><div class="empty-state">${t('noData')}</div></div>`;
  const rows = rs.map(({ id, r }) => {
    const sum = tone => r.rows.filter(x => x.tone === tone).reduce((a, b) => a + b.n, 0);
    return {
      id, r, pos: sum('ok'), cau: sum('caution'), neg: sum('crit'), mis: sum('missing'),
      lab: LANG === 'en' ? r.spec.label_en : r.spec.label_id
    };
  });
  const w = (n, d) => (100 * n / d).toFixed(2) + '%';
  const body = `<div class="divg">
    ${rows.map(x => `<div class="divg-row">
      <div class="divg-head"><span class="divg-lab">${esc(x.lab)}</span>
        <span class="divg-n">n=${x.r.valid}${x.r.valid < CAU() ? ' ⚠' : ''}</span></div>
      <div class="divg-track">
        <div class="divg-left"><span class="seg" style="width:${w(x.pos, x.r.valid)};background:var(--c-ok)"
          title="${LANG === 'en' ? 'positive' : 'positif'}: ${x.pos}/${x.r.valid}"></span></div>
        <div class="divg-right">
          <span class="seg" style="width:${w(x.cau, x.r.valid)};background:var(--c-caution)" title="${LANG === 'en' ? 'partial' : 'sebagian'}: ${x.cau}"></span>
          <span class="seg" style="width:${w(x.neg, x.r.valid)};background:var(--c-crit)" title="${LANG === 'en' ? 'negative' : 'negatif'}: ${x.neg}"></span>
          <span class="seg" style="width:${w(x.mis, x.r.valid)};background:var(--c-missing)" title="${t('nonsub')}: ${x.mis}"></span>
        </div>
      </div>
    </div>`).join('')}
  </div>
  <div class="legend">
    <span><i style="background:var(--c-ok)"></i>${LANG === 'en' ? 'Functioning / positive' : 'Berfungsi / positif'}</span>
    <span><i style="background:var(--c-caution)"></i>${LANG === 'en' ? 'Partial / conditional' : 'Sebagian / bersyarat'}</span>
    <span><i style="background:var(--c-crit)"></i>${LANG === 'en' ? 'Critical / negative' : 'Kritis / negatif'}</span>
    <span><i style="background:var(--c-missing)"></i>${t('nonsub')}</span>
  </div>`;
  const tbl = () => `<table class="tbl"><thead><tr><th>${LANG === 'en' ? 'Indicator' : 'Indikator'}</th>
    <th class="num">+</th><th class="num">±</th><th class="num">−</th><th class="num">${t('nonsub')}</th>
    <th class="num">${t('n')}</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td>${esc(x.lab)}</td><td class="num">${x.pos}</td><td class="num">${x.cau}</td>
      <td class="num">${x.neg}</td><td class="num">${x.mis}</td><td class="num">${x.r.valid}</td></tr>`).join('')}
    </tbody></table>`;
  const anyCaution = rows.some(x => x.r.valid < CAU());
  return `<div class="card"><h3>${esc(title)} ${anyCaution ? `<span class="flag warn">${t('smallN')}</span>` : ''}</h3>
    ${sub ? `<p class="card-sub">${esc(sub)}</p>` : ''}${body}
    <details class="meta"><summary>${t('tableAlt')}</summary><div class="tbl-wrap">${tbl()}</div></details></div>`;
}

/* ------------------------------------------------------------- numeric */
/** Box plot with Tukey whiskers. The plotted domain is the whisker range, not
 *  min–max: a single extreme value (travel time of 300 minutes among a median
 *  of 20) would otherwise compress the IQR into a few pixels. Values beyond the
 *  fences are counted and named rather than hidden. */
function box(id, opts = {}) {
  const st = stats(id);
  const s = st.spec || DATA.ind[id];
  const title = opts.title || (LANG === 'en' ? s.label_en : s.label_id);
  if (st.blocked || st.sdc || st.empty) return card(st, title, opts.sub, '', null);

  const iqr = st.q3 - st.q1;
  const loFence = st.q1 - 1.5 * iqr, hiFence = st.q3 + 1.5 * iqr;
  const inside = st.values.filter(v => v >= loFence && v <= hiFence);
  const wLo = inside.length ? inside[0] : st.min;
  const wHi = inside.length ? inside[inside.length - 1] : st.max;
  const out = st.values.filter(v => v < wLo || v > wHi);

  const lo = wLo, hi = Math.max(wHi, wLo + 1);
  const clamp = v => Math.min(100, Math.max(0, 100 * (v - lo) / (hi - lo)));
  const at = v => clamp(v).toFixed(2) + '%';
  const wd = (a, b) => (clamp(b) - clamp(a)).toFixed(2) + '%';

  const body = `<div class="boxp" role="img"
      aria-label="${esc(title)} — ${t('median')} ${fmt(st.median)} ${esc(tUnit(s.unit))}, IQR ${fmt(st.q1)}–${fmt(st.q3)}, n=${st.n}">
      <div class="boxp-track">
        <span class="boxp-whisk" style="left:${at(wLo)};width:${wd(wLo, wHi)}"></span>
        <span class="boxp-cap" style="left:${at(wLo)}"></span>
        <span class="boxp-cap" style="left:${at(wHi)}"></span>
        <span class="boxp-iqr" style="left:${at(st.q1)};width:${wd(st.q1, st.q3)}" title="IQR ${fmt(st.q1)}–${fmt(st.q3)}"></span>
        <span class="boxp-med" style="left:${at(st.median)}" title="${t('median')} ${fmt(st.median)}"></span>
      </div>
      <div class="boxp-scale"><span>${fmt(wLo)}</span>
        <span class="boxp-mid"><b>${t('median')} ${fmt(st.median)}</b> ${esc(tUnit(s.unit))}</span>
        <span>${fmt(wHi)}</span></div>
      ${out.length ? `<p class="boxp-out">${LANG === 'en'
        ? `${out.length} value${out.length > 1 ? 's' : ''} beyond the whiskers (up to ${fmt(st.max)} ${tUnit(s.unit)}), shown in the table below`
        : `${out.length} nilai di luar pagar Tukey (hingga ${fmt(st.max)} ${tUnit(s.unit)}), tercantum pada tabel di bawah`}</p>` : ''}
    </div>`;
  const tbl = () => `<table class="tbl"><tbody>
    <tr><td>${t('median')}</td><td class="num">${fmt(st.median)} ${esc(tUnit(s.unit))}</td></tr>
    <tr><td>${t('iqr')} (Q1–Q3)</td><td class="num">${fmt(st.q1)} – ${fmt(st.q3)}</td></tr>
    <tr><td>${LANG === 'en' ? 'Whiskers (Tukey 1.5 × IQR)' : 'Pagar (Tukey 1,5 × IQR)'}</td>
      <td class="num">${fmt(wLo)} – ${fmt(wHi)}</td></tr>
    <tr><td>${t('range')}</td><td class="num">${fmt(st.min)} – ${fmt(st.max)}</td></tr>
    <tr><td>${LANG === 'en' ? 'Beyond whiskers' : 'Di luar pagar'}</td><td class="num">${out.length}</td></tr>
    <tr><td>${t('n')}</td><td class="num">${st.n} / ${st.base}</td></tr></tbody></table>`;
  return card(st, title, opts.sub || `${t('median')} ${fmt(st.median)} ${tUnit(s.unit)} · IQR ${fmt(st.q1)}–${fmt(st.q3)} · n=${st.n}`, body, tbl);
}

/** Before/after direction split for paired numeric questions. */
function pairChart(id, opts = {}) {
  const p = pairStats(id);
  const s = p.spec || DATA.ind[id];
  const title = opts.title || (LANG === 'en' ? s.label_en : s.label_id);
  if (p.blocked || p.sdc || p.empty) return card(p, title, opts.sub, '', null);
  const seg = [
    { k: t('up'), n: p.up, c: opts.invert ? 'var(--c-ok)' : 'var(--c-crit)' },
    { k: t('same'), n: p.same, c: 'var(--c-info)' },
    { k: t('down'), n: p.down, c: opts.invert ? 'var(--c-crit)' : 'var(--c-ok)' }
  ];
  const body = `<div class="stack" role="img" aria-label="${esc(title)}: ${esc(seg.map(v => `${v.k} ${v.n}`).join(', '))}">
      ${seg.map(v => {
        const w = 100 * v.n / p.n;
        return `<span class="seg" style="width:${w.toFixed(2)}%;background:${v.c}"
          title="${esc(v.k)}: ${v.n}/${p.n}">${w > 12 ? v.n : ''}</span>`;
      }).join('')}
    </div>
    <div class="legend">${seg.map(v => `<span><i style="background:${v.c}"></i>${esc(v.k)} · ${v.n} (${pc(100 * v.n / p.n)})</span>`).join('')}</div>`;
  const sub = opts.sub || `${LANG === 'en' ? 'Median change' : 'Median perubahan'} ${p.medianPct === null ? '–' : fmt(p.medianPct) + '%'} · n=${p.n}`;
  const tbl = () => `<table class="tbl"><tbody>
    ${seg.map(v => `<tr><td>${esc(v.k)}</td><td class="num">${v.n}</td><td class="num">${pc(100 * v.n / p.n)}</td></tr>`).join('')}
    <tr><td>${LANG === 'en' ? 'Median ratio (now/before)' : 'Median rasio (kini/sebelum)'}</td>
      <td class="num" colspan="2">${fmt(p.medianRatio, 2)}</td></tr>
    <tr><td>${t('n')}</td><td class="num" colspan="2">${p.n} / ${p.base}</td></tr></tbody></table>`;
  return card(p, title, sub, body, tbl);
}

/* ------------------------------------------------------------- heatmap */
/* Registry of CSV payloads built at render time, keyed by the export id on the
   download button. Rebuilt on every render, so it always matches what is on
   screen under the active filter. */
const EXPORTS = {};

/** Normalise a heatmap row: either an indicator id, or an object that targets
 *  specific response options and carries its own label. */
function hmRow(spec) {
  if (typeof spec === 'string') {
    const s = DATA.ind[spec];
    return s ? { id: spec, s, keys: null, label: LANG === 'en' ? s.label_en : s.label_id } : null;
  }
  const s = DATA.ind[spec.id];
  if (!s) return null;
  return {
    id: spec.id, s, keys: spec.keys || null,
    label: spec.label ? (spec.label[LANG] || spec.label.id) : (LANG === 'en' ? s.label_en : s.label_id)
  };
}

/** Geographic comparison as a colour-coded table, one column per kabupaten.
 *  Each cell is computed by re-running the indicator with that district as the
 *  only district filter, so every other active filter still applies. */
function heatmap(rows, title, sub, opts = {}) {
  const kabs = DATA.meta.kabupaten.filter(k => !F.kab.length || F.kab.includes(k));
  const specs = rows.map(hmRow).filter(Boolean);
  if (!specs.length || !kabs.length) {
    return `<div class="card chart-card" data-reveal><div class="card-hd"><h3>${esc(title)}</h3></div>
      <div class="state state-empty"><p>${t('noData')}</p>
      <p class="state-hint">${t('noDataHint')}</p></div></div>`;
  }

  const save = F.kab.slice();
  let sdcHit = false;
  const grid = specs.map(g => {
    const row = kabs.map(k => {
      F.kab = [k];
      const r = result(g.id);
      F.kab = save;
      if (r.blocked) return { v: null, n: 0, sup: false, na: 'blocked' };
      if (r.sdc) { sdcHit = true; return { v: null, n: 0, sup: false, na: 'sdc' }; }
      if (r.empty) return { v: null, n: 0, sup: false, na: 'empty' };
      const num = g.keys
        ? r.rows.filter(x => g.keys.includes(x.key)).reduce((a, b) => a + b.n, 0)
        : (r.headline ?? null);
      const v = num === null || !r.valid ? null : 100 * num / r.valid;
      return { v, n: r.valid, num, sup: r.valid < SUP() && !r.countsOnly };
    });
    return { g, row };
  });

  const band = v => v === null ? 'na' : v >= 75 ? 'hi' : v >= 50 ? 'mid' : v >= 25 ? 'lo' : 'vlo';
  const cell = (c, lab) => {
    const b = (c.sup || c.v === null) ? 'na' : band(c.v);
    const txt = c.na === 'sdc' ? 'SDC' : c.v === null ? '–' : (c.sup ? `n<${SUP()}` : Math.round(c.v) + '%');
    return `<td class="hm-c hm-${b}" title="${esc(lab)}: ${txt} · n=${c.n}">
      <span class="hm-v">${txt}</span><span class="hm-n">n=${c.n}</span></td>`;
  };

  /* CSV of the whole matrix: one row per indicator and district, carrying the
     numerator, denominator and percentage so the table can be reused offline. */
  const exId = opts.exportId || ('hm-' + Math.random().toString(36).slice(2, 8));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  EXPORTS[exId] = [
    ['indicator_id', 'indicator', 'numerator_options', 'kabupaten', 'numerator', 'denominator', 'percent', 'note'].join(','),
    ...grid.flatMap(g => g.row.map((c, j) => [
      g.g.id, q(g.g.label), q(g.g.keys ? g.g.keys.join(' | ') : (g.g.s.numerator || '')),
      q(kabs[j]), c.num ?? '', c.n || '',
      c.v === null ? '' : c.v.toFixed(1),
      q(c.na === 'sdc' ? 'disuppress: filter kecamatan aktif pada indikator sensitif'
        : c.sup ? `disuppress: n<${SUP()}` : c.na === 'empty' ? 'tidak ada record valid' : '')
    ].join(','))),
    '',
    q('Filter aktif: ' + filterLabel()),
    q('Sumber: ' + (DATA.meta.source_files || []).join(', ')),
    q('Dibuat: ' + new Date().toISOString())
  ].join('\n');

  return `<div class="card chart-card" data-reveal>
    <div class="card-hd"><h3>${esc(title)}</h3>
      <button type="button" class="ic-btn" data-dlmatrix="${exId}" data-name="${esc(opts.file || 'matriks-kabupaten')}"
        title="${t('dlChart')}" aria-label="${t('dlChart')}">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
      </button></div>
    ${sub ? `<p class="card-sub">${esc(sub)}</p>` : ''}
    <div class="tbl-wrap"><table class="tbl hm">
      <caption class="sr-only">${esc(title)}</caption>
      <thead><tr><th scope="col">${LANG === 'en' ? 'Indicator' : 'Indikator'}</th>
        ${kabs.map(k => `<th scope="col" class="num">${esc(k)}</th>`).join('')}</tr></thead>
      <tbody>${grid.map(g => `<tr><th scope="row" class="hm-lab">${esc(g.g.label)}</th>
        ${g.row.map(c => cell(c, g.g.label)).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="legend">
      <span><i class="hm-hi"></i>≥75%</span><span><i class="hm-mid"></i>50–74%</span>
      <span><i class="hm-lo"></i>25–49%</span><span><i class="hm-vlo"></i>&lt;25%</span>
      <span><i class="hm-na"></i>${t('suppressed')} / ${t('noData')}</span>
    </div>
    ${sdcHit ? `<p class="hm-note">${icoFlag('shield')} ${t('sdcBlocked')}</p>` : ''}
    <div class="card-ft"><details class="meta"><summary>${t('detail')}</summary><dl>
      ${specs.map(g => `<dt>${esc(g.label)}</dt><dd>${esc(g.keys
        ? `${LANG === 'en' ? 'Numerator' : 'Pembilang'}: ${g.keys.join(', ')}` : g.s.numerator)} ÷ ${esc(g.s.denominator)}
        · <code>${esc(g.s.source_fields[0])}</code></dd>`).join('')}
      <dt>${t('filt')}</dt><dd>${esc(filterLabel())}</dd>
    </dl></details></div></div>`;
}

/* ------------------------------------------------------------- count bars */
/** Distribution of the filtered records across a metadata dimension. */
function dimBar(dim, title, tone = 'info', group) {
  const o = countBy(dim, group);
  const rows = Object.entries(o).sort((a, b) => b[1] - a[1]);
  const tot = rows.reduce((a, b) => a + b[1], 0);
  if (!rows.length) return `<div class="card"><h3>${esc(title)}</h3><div class="empty-state">${t('noData')}</div></div>`;
  const max = Math.max(...rows.map(r => r[1]));
  const lab = k => dim === 'grp' ? (DATA.meta.group_labels[k]?.[LANG] || k) : tOpt(k);
  return `<div class="card"><h3>${esc(title)}</h3>
    <p class="card-sub">${t('n')}=${tot} ${t('records')}</p>
    <div class="bars" role="list" aria-label="${esc(title)}">
      ${rows.map(([k, v]) => `<div class="bar-row" role="listitem">
        <span class="bar-lab" title="${esc(lab(k))}">${esc(lab(k))}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${(100 * v / max).toFixed(2)}%;background:var(--c-${tone})"></span></span>
        <span class="bar-val"><b>${v}</b><span class="bar-n">${pc(100 * v / tot)}</span></span>
      </div>`).join('')}
    </div>
    <details class="meta"><summary>${t('tableAlt')}</summary><div class="tbl-wrap">
      <table class="tbl"><thead><tr><th>${esc(title)}</th><th class="num">${t('count')}</th>
        <th class="num">${t('pct')}</th></tr></thead>
      <tbody>${rows.map(([k, v]) => `<tr><td>${esc(lab(k))}</td><td class="num">${v}</td>
        <td class="num">${pc(100 * v / tot)}</td></tr>`).join('')}</tbody></table>
    </div></details></div>`;
}

/* ------------------------------------------------------------- narrative */
const layer = (kind, html) => `<div class="layer ${kind}"><span>${t(kind)}</span><p>${html}</p></div>`;

</script>
<script>
/* ==== narrative.js ==== */
/* ==========================================================================
   EVIDENCE ENGINE
   Triangulation and CVA feasibility are derived from the filtered aggregates,
   so every verdict carries the sample size it was computed on. Interpretive
   sentences stay separated from the facts they rest on: FACT / ANALYSIS /
   ASSUMPTION / RECOMMENDATION are never mixed inside one paragraph.
   Classification vocabulary is restricted to exactly four values.
   ========================================================================== */

const FEAS_CLASS = {
  potential:    { id: 'Berpotensi Layak',        en: 'Potentially feasible',      flag: 'ok',   icon: 'check' },
  conditional:  { id: 'Layak dengan Persyaratan', en: 'Feasible with conditions',  flag: 'warn', icon: 'alert' },
  insufficient: { id: 'Bukti Belum Memadai',     en: 'Insufficient evidence',     flag: 'grey', icon: 'help' },
  not_now:      { id: 'Belum Direkomendasikan',  en: 'Not recommended at present', flag: 'crit', icon: 'stop' }
};

/** Headline share of an indicator under the active filter, or null. */
const ZERO = { pct: null, n: 0, denom: 0, base: 0, caution: false, sup: false };
function share(id) {
  const r = result(id);
  if (r.blocked || r.sdc || r.empty || r.headlinePct === null) return ZERO;
  return { pct: r.headlinePct, n: r.valid, denom: r.valid, base: r.base, caution: r.caution, sup: r.suppressed };
}
/** Share of one specific option. */
function optShare(id, keys) {
  const r = result(id);
  if (r.blocked || r.sdc || r.empty) return ZERO;
  const n = r.rows.filter(x => keys.includes(x.key)).reduce((a, b) => a + b.n, 0);
  return { pct: r.valid ? 100 * n / r.valid : null, n, denom: r.valid, base: r.base, caution: r.caution };
}
const sN = s => s ? `${fmt(s.pct)}% (${s.n}/${s.n !== undefined && s.denom !== undefined ? s.denom : s.n}${s.denom === undefined ? '' : ''})` : '–';
const sv = s => s === null || s === undefined ? '–' : `${fmt(s.pct)}%`;
const svn = s => s === null || s === undefined ? '–' : `${fmt(s.pct)}% · n=${s.denom ?? s.n}`;

/* ---------------------------------------------------------------- triangulation */
function triangulation() {
  const rows = [];

  // 1. Availability of essential goods
  const hhAv = optShare('hh_avail', ['Selalu']);
  const hhAvAny = optShare('hh_avail', ['Selalu', 'Kadang']);
  const govAv = optShare('p_avail', ['Naik', 'Tetap']);
  const trStock = pairStats('t_stock');
  rows.push({
    theme: { id: 'Ketersediaan barang pokok', en: 'Availability of essential goods' },
    src: [
      { g: 'RT', txt: { id: `Tersedia selalu ${sv(hhAv)}; tersedia selalu/kadang ${sv(hhAvAny)}`, en: `Always available ${sv(hhAv)}; always or sometimes ${sv(hhAvAny)}` }, n: hhAv?.denom },
      { g: 'PEM', txt: { id: `Ketersediaan naik/tetap ${sv(govAv)}`, en: `Availability up or unchanged ${sv(govAv)}` }, n: govAv?.denom },
      { g: 'PDG', txt: { id: `Stok turun pada ${trStock.down}/${trStock.n} pedagang`, en: `Stock fell for ${trStock.down}/${trStock.n} traders` }, n: trStock.n }
    ],
    verdict: 'partial',
    note: {
      id: 'Barang ada di pasar, tetapi stok di tingkat pedagang menyusut — ketersediaan saat ini belum menjamin ketersediaan berkelanjutan.',
      en: 'Goods are present in markets while trader-level stock is shrinking — current availability does not guarantee sustained availability.'
    }
  });

  // 2. Affordability / prices
  const hhAff = optShare('hh_afford', ['Ya']);
  const hhAffPart = optShare('hh_afford', ['Hanya Sebagian', 'Tidak']);
  const govPrice = optShare('p_price', ['Naik']);
  const sell = pairStats('t_sellprice');
  rows.push({
    theme: { id: 'Keterjangkauan dan harga', en: 'Affordability and prices' },
    src: [
      { g: 'RT', txt: { id: `Terjangkau penuh ${sv(hhAff)}; hanya sebagian/tidak ${sv(hhAffPart)}`, en: `Fully affordable ${sv(hhAff)}; only partly or not ${sv(hhAffPart)}` }, n: hhAff?.denom },
      { g: 'PEM', txt: { id: `Melaporkan harga naik ${sv(govPrice)}`, en: `Reporting price increases ${sv(govPrice)}` }, n: govPrice?.denom },
      { g: 'PDG', txt: { id: `Harga jual naik pada ${sell.up}/${sell.n} pedagang`, en: `Selling price up for ${sell.up}/${sell.n} traders` }, n: sell.n }
    ],
    verdict: 'contra',
    note: {
      id: 'Mayoritas pemerintah dan pedagang melaporkan harga relatif stabil, tetapi hanya sebagian kecil rumah tangga menyatakan harga terjangkau. Pola ini mengarah pada masalah daya beli akibat kehilangan pendapatan, bukan lonjakan harga. Memerlukan verifikasi melalui pemantauan harga komoditas dan perhitungan MEB.',
      en: 'Most government and trader respondents report broadly stable prices while only a minority of households report goods as affordable. The pattern points to a purchasing-power problem driven by income loss rather than a price spike, and needs verification through commodity price monitoring and an MEB calculation.'
    }
  });

  // 3. Physical market access
  const hhSafe = optShare('hh_safeaccess', ['Ya']);
  const hhHard = optShare('hh_safeaccess', ['Dengan Kesulitan', 'Tidak']);
  const govRoad = optShare('p_impact', ['Jalan/Jembatan']);
  const tt = stats('hh_traveltime');
  rows.push({
    theme: { id: 'Akses fisik ke pasar', en: 'Physical market access' },
    src: [
      { g: 'RT', txt: { id: `Dapat mencapai pasar dengan aman ${sv(hhSafe)}; sulit/tidak bisa ${sv(hhHard)}; median tempuh ${fmt(tt.median)} menit`, en: `Can reach market safely ${sv(hhSafe)}; with difficulty or not at all ${sv(hhHard)}; median travel ${fmt(tt.median)} minutes` }, n: hhSafe?.denom },
      { g: 'PEM', txt: { id: `Melaporkan kerusakan jalan/jembatan ${sv(govRoad)}`, en: `Reporting road/bridge damage ${sv(govRoad)}` }, n: govRoad?.denom },
      { g: 'PDG', txt: { id: `Jalan/jembatan rusak sebagai tantangan ${sv(optShare('t_challenge', ['Jalan/Jembatan Rusak']))}`, en: `Road/bridge damage as a challenge ${sv(optShare('t_challenge', ['Jalan/Jembatan Rusak']))}` }, n: pairSafe('t_challenge') }
    ],
    verdict: 'conv',
    note: {
      id: 'Ketiga sumber menunjukkan hambatan akses yang nyata namun tidak menyeluruh. Hambatan terbesar menurut rumah tangga adalah jarak dan ketersediaan/biaya transportasi, bukan kerusakan jalan semata.',
      en: 'All three sources show real but not universal access constraints. The largest household-reported barriers are distance and transport availability or cost rather than road damage alone.'
    }
  });

  // 4. CVA readiness
  const acct = optShare('hh_account', ['Ya']);
  const cash = optShare('hh_method_access', ['Tunai Fisik']);
  const tVouch = optShare('t_voucher', ['Ya', 'Dengan Syarat']);
  const fspOk = optShare('l_status', ['Normal']);
  const govOk = optShare('p_cva_feasible', ['Ya', 'Ya Dengan Syarat']);
  rows.push({
    theme: { id: 'Kesiapan bantuan tunai/voucher', en: 'Cash and voucher readiness' },
    src: [
      { g: 'RT', txt: { id: `Punya akun keuangan aktif ${sv(acct)}; tunai fisik dapat diakses ${sv(cash)}`, en: `Active financial account ${sv(acct)}; physical cash accessible ${sv(cash)}` }, n: acct?.denom },
      { g: 'PDG', txt: { id: `Bersedia menerima voucher ${sv(tVouch)}; mampu restocking 7–30 hari ${sv(optShare('t_scaleup', ['Ya']))}`, en: `Willing to accept vouchers ${sv(tVouch)}; able to restock in 7–30 days ${sv(optShare('t_scaleup', ['Ya']))}` }, n: tVouch?.denom },
      { g: 'FSP', txt: { id: `Status operasional normal ${sv(fspOk)}; likuiditas hanya terjawab oleh ${pairSafe('l_liquidity')} responden`, en: `Operational status normal ${sv(fspOk)}; liquidity answered by only ${pairSafe('l_liquidity')} respondents` }, n: fspOk?.denom },
      { g: 'PEM', txt: { id: `Menilai layak/layak bersyarat ${sv(govOk)}`, en: `Assess as feasible or conditionally feasible ${sv(govOk)}` }, n: govOk?.denom }
    ],
    verdict: 'partial',
    note: {
      id: 'Sisi permintaan (rumah tangga) dan penerimaan pemerintah mendukung modalitas tunai. Sisi penawaran layanan keuangan belum terbukti: modul likuiditas dan jaringan FSP hanya dijawab oleh sangat sedikit responden.',
      en: 'The demand side and government acceptance support a cash modality. The financial-service supply side is unproven: the liquidity and network modules were answered by very few respondents.'
    }
  });

  // 5. Protection and security
  const conf = optShare('hh_conflict', ['Ya', 'Mungkin']);
  const refuse = optShare('hh_conflict', ['Memilih Tidak Menjawab']);
  const secBar = optShare('hh_barrier', ['Keamanan']);
  const govSec = optShare('p_cva_risk', ['Keamanan']);
  rows.push({
    theme: { id: 'Perlindungan dan keamanan', en: 'Protection and security' },
    src: [
      { g: 'RT', txt: { id: `Risiko konflik ya/mungkin ${sv(conf)}; memilih tidak menjawab ${sv(refuse)}; keamanan sebagai hambatan pasar ${sv(secBar)}`, en: `Conflict risk yes or possible ${sv(conf)}; preferred not to answer ${sv(refuse)}; security as a market barrier ${sv(secBar)}` }, n: conf?.denom },
      { g: 'PEM', txt: { id: `Keamanan sebagai risiko CVA ${sv(govSec)}`, en: `Security as a CVA risk ${sv(govSec)}` }, n: govSec?.denom },
      { g: 'NGO', txt: { id: `Keamanan disebut oleh ${optShare('n_cva_risk', ['Keamanan'])?.n ?? 0} dari ${pairSafe('n_cva_risk')} NGO`, en: `Security named by ${optShare('n_cva_risk', ['Keamanan'])?.n ?? 0} of ${pairSafe('n_cva_risk')} NGOs` }, n: pairSafe('n_cva_risk') }
    ],
    verdict: 'contra',
    note: {
      id: 'Rumah tangga secara umum tidak melaporkan risiko konflik langsung, tetapi seperempat menyebut keamanan sebagai hambatan akses pasar dan seluruh NGO menempatkan keamanan sebagai risiko utama CVA. Perbedaan ini konsisten dengan under-reporting pada pertanyaan sensitif — 8% rumah tangga memilih tidak menjawab.',
      en: 'Households largely do not report direct conflict risk, yet a quarter name security as a market-access barrier and every NGO ranks security as a main CVA risk. The divergence is consistent with under-reporting on a sensitive question — 8% of households preferred not to answer.'
    }
  });

  return rows;
}
/** Valid-response count that is safe when a module is blocked, suppressed or empty. */
function pairSafe(id) { const r = result(id); return r.valid ?? 0; }

/* ---------------------------------------------------------------- feasibility */
function feasibility() {
  const g = id => optShare(id, headlineKeys(DATA.ind[id] || {}) || []);
  const F17 = [];
  const add = (o) => F17.push(o);

  const avail = optShare('hh_avail', ['Selalu', 'Kadang']);
  const stock = pairStats('t_stock');
  add({
    k: 1, name: { id: 'Ketersediaan barang di pasar', en: 'Market availability' }, cls: 'potential',
    evid: { id: `Rumah tangga: ${sv(avail)} melaporkan barang selalu atau kadang tersedia (n=${avail?.denom ?? 0}). Pemerintah: ${sv(optShare('p_market_status', ['Normal', 'Berfungsi Sebagian']))} menilai pasar berfungsi normal atau sebagian (n=${pairSafe('p_market_status')}).`,
           en: `Households: ${sv(avail)} report goods always or sometimes available (n=${avail?.denom ?? 0}). Government: ${sv(optShare('p_market_status', ['Normal', 'Berfungsi Sebagian']))} assess markets as normal or partly functioning (n=${pairSafe('p_market_status')}).` },
    risk: { id: `Stok menyusut pada ${stock.down} dari ${stock.n} pedagang dengan data stok lengkap.`, en: `Stock fell for ${stock.down} of ${stock.n} traders with complete stock data.` },
    mitig: { id: 'Pemantauan ketersediaan mingguan pada pasar yang dipilih sebagai titik rujukan CVA.', en: 'Weekly availability monitoring at markets selected as CVA reference points.' },
    geo: { id: '7 kabupaten terkaji', en: '7 assessed districts' },
    gap: { id: 'Tidak ada daftar komoditas seragam; ketersediaan diukur pada "produk utama" yang berbeda antar lokasi.', en: 'No uniform commodity list; availability was measured against a locally defined “main product”.' }
  });

  const sell = pairStats('t_sellprice'), buy = pairStats('t_buyprice');
  add({
    k: 2, name: { id: 'Stabilitas harga', en: 'Price stability' }, cls: 'conditional',
    evid: { id: `Pedagang: harga jual tetap pada ${sell.same}/${sell.n}, naik pada ${sell.up}/${sell.n}. Harga beli naik pada ${buy.up}/${buy.n}. Pemerintah: ${sv(optShare('p_price', ['Tetap']))} menilai harga tetap.`,
           en: `Traders: selling price unchanged for ${sell.same}/${sell.n}, up for ${sell.up}/${sell.n}. Purchase price up for ${buy.up}/${buy.n}. Government: ${sv(optShare('p_price', ['Tetap']))} assess prices as unchanged.` },
    risk: { id: 'Tekanan biaya dari sisi pemasok lebih besar daripada kenaikan harga jual, berpotensi menggerus modal pedagang dan memicu kenaikan harga tertunda.', en: 'Supplier-side cost pressure exceeds selling-price increases, which can erode trader capital and produce delayed price rises.' },
    mitig: { id: 'Pemantauan harga komoditas terstandardisasi mingguan sebelum dan selama penyaluran; klausul penyesuaian nilai transfer.', en: 'Standardised weekly commodity price monitoring before and during disbursement; a transfer-value adjustment clause.' },
    geo: { id: 'Tingkat kabupaten', en: 'District level' },
    gap: { id: 'Besaran perubahan harga tidak dapat dihitung karena satuan produk (U12) tidak terharmonisasi.', en: 'The magnitude of price change cannot be computed because the product unit field (U12) is not harmonised.' }
  });

  const aff = optShare('hh_afford', ['Ya']);
  const inc = optShare('hh_income_chg', ['Turun', 'Berhenti']);
  add({
    k: 3, name: { id: 'Keterjangkauan rumah tangga', en: 'Household affordability' }, cls: 'conditional',
    evid: { id: `Hanya ${sv(aff)} rumah tangga menyatakan harga terjangkau penuh, sementara ${sv(inc)} melaporkan pendapatan turun atau berhenti (n=${inc?.denom ?? 0}).`,
           en: `Only ${sv(aff)} of households report goods as fully affordable, while ${sv(inc)} report income reduced or stopped (n=${inc?.denom ?? 0}).` },
    risk: { id: 'Nilai transfer yang terlalu rendah tidak akan menutup kesenjangan daya beli; separuh rumah tangga sudah mengurangi konsumsi makan.', en: 'A transfer value set too low will not close the purchasing-power gap; half of households are already reducing food consumption.' },
    mitig: { id: 'Hitung MEB dan nilai transfer berbasis harga pasar lokal; tinjau ulang setiap bulan.', en: 'Calculate an MEB and transfer value from local market prices; review monthly.' },
    geo: { id: 'Tingkat kabupaten', en: 'District level' },
    gap: { id: 'Tidak ada data pengeluaran, pendapatan nominal, atau MEB dalam asesmen ini.', en: 'This assessment contains no expenditure, nominal income or MEB data.' }
  });

  const safe = optShare('hh_safeaccess', ['Ya']);
  add({
    k: 4, name: { id: 'Akses fisik yang aman ke pasar', en: 'Safe physical market access' }, cls: 'conditional',
    evid: { id: `${sv(safe)} rumah tangga dapat mencapai pasar dengan aman; median waktu tempuh ${fmt(stats('hh_traveltime').median)} menit (n=${stats('hh_traveltime').n}). Hambatan terbesar: jarak ${sv(optShare('hh_barrier', ['Jarak']))} dan transportasi ${sv(optShare('hh_barrier', ['Transportasi Tidak Ada/Mahal']))}.`,
           en: `${sv(safe)} of households can reach a market safely; median travel time ${fmt(stats('hh_traveltime').median)} minutes (n=${stats('hh_traveltime').n}). Largest barriers: distance ${sv(optShare('hh_barrier', ['Jarak']))} and transport ${sv(optShare('hh_barrier', ['Transportasi Tidak Ada/Mahal']))}.` },
    risk: { id: `${sv(optShare('hh_safeaccess', ['Tidak']))} tidak dapat mencapai pasar sama sekali; ${sv(optShare('hh_barrier', ['Mobilitas/Disabilitas']))} menyebut hambatan mobilitas/disabilitas.`, en: `${sv(optShare('hh_safeaccess', ['Tidak']))} cannot reach a market at all; ${sv(optShare('hh_barrier', ['Mobilitas/Disabilitas']))} cite mobility or disability barriers.` },
    mitig: { id: 'Titik penyaluran bergerak atau pengantaran untuk rumah tangga dengan hambatan mobilitas; pertimbangkan komponen transportasi.', en: 'Mobile payout points or delivery for households with mobility barriers; consider a transport component.' },
    geo: { id: 'Tingkat kecamatan untuk perencanaan titik layanan', en: 'Sub-district level for service-point planning' },
    gap: { id: 'Biaya transportasi (R15) tidak dapat digunakan karena satuan bercampur.', en: 'Transport cost (R15) is unusable because two units are mixed in one field.' }
  });

  add({
    k: 5, name: { id: 'Kapasitas pasokan pedagang', en: 'Trader supply capacity' }, cls: 'conditional',
    evid: { id: `Tantangan utama: pemasok berkurang ${sv(optShare('t_challenge', ['Pemasok Berkurang']))}, stok menipis ${sv(optShare('t_challenge', ['Stok Terbatas/Menipis']))} (n=${pairSafe('t_challenge')}). Sumber pasok dominan dari dalam kabupaten ${sv(optShare('t_source', ['Dalam Kabupaten']))}.`,
           en: `Main challenges: fewer suppliers ${sv(optShare('t_challenge', ['Pemasok Berkurang']))}, thin stock ${sv(optShare('t_challenge', ['Stok Terbatas/Menipis']))} (n=${pairSafe('t_challenge')}). Dominant sourcing is within the district ${sv(optShare('t_source', ['Dalam Kabupaten']))}.` },
    risk: { id: 'Injeksi daya beli tanpa dukungan sisi pasokan berisiko mendorong harga naik pada rantai pasok yang sudah tertekan kekeringan sebelum gempa.', en: 'Injecting purchasing power without supply-side support risks pushing prices up in a chain already stressed by pre-earthquake drought.' },
    mitig: { id: 'Penyaluran bertahap; libatkan pedagang grosir tingkat kabupaten; siapkan opsi in-kind untuk komoditas yang pasokannya rapuh.', en: 'Phased disbursement; engage district-level wholesalers; keep an in-kind option for commodities with fragile supply.' },
    geo: { id: 'Tingkat kabupaten', en: 'District level' },
    gap: { id: 'Volume pasokan dan kapasitas gudang tidak dikuantifikasi.', en: 'Supply volumes and storage capacity are not quantified.' }
  });

  const rs = pairStats('t_restock_ratio'), rd = stats('t_restock_days');
  add({
    k: 6, name: { id: 'Kapasitas restocking pedagang', en: 'Trader restocking capacity' }, cls: 'conditional',
    evid: { id: `${sv(optShare('t_scaleup', ['Ya']))} mampu menambah pasokan dalam 7–30 hari, ${sv(optShare('t_scaleup', ['Sebagian']))} sebagian, ${sv(optShare('t_scaleup', ['Tidak']))} tidak mampu (n=${pairSafe('t_scaleup')}). Median waktu restocking saat ini ${fmt(rd.median)} hari (IQR ${fmt(rd.q1)}–${fmt(rd.q3)}, n=${rd.n}); lebih lambat dibanding normal pada ${rs.up}/${rs.n} pedagang.`,
           en: `${sv(optShare('t_scaleup', ['Ya']))} can increase supply within 7–30 days, ${sv(optShare('t_scaleup', ['Sebagian']))} partly, ${sv(optShare('t_scaleup', ['Tidak']))} cannot (n=${pairSafe('t_scaleup')}). Median current restocking time ${fmt(rd.median)} days (IQR ${fmt(rd.q1)}–${fmt(rd.q3)}, n=${rd.n}); slower than normal for ${rs.up}/${rs.n} traders.` },
    risk: { id: 'Sepertiga pedagang menyatakan tidak mampu menambah pasokan, sehingga pasar tertentu dapat kehabisan stok saat penyaluran serentak.', en: 'A third of traders state they cannot increase supply, so specific markets may run out of stock during simultaneous disbursement.' },
    mitig: { id: 'Pilih pasar rujukan berdasarkan kemampuan restocking yang terverifikasi; jadwalkan penyaluran mengikuti siklus restocking 7 hari.', en: 'Select reference markets on verified restocking ability; schedule disbursement around the 7-day restocking cycle.' },
    geo: { id: 'Tingkat pasar (perlu verifikasi lapangan)', en: 'Market level (requires field verification)' },
    gap: { id: 'Jumlah tambahan pasokan hanya tersedia sebagai teks bebas dan tidak dipublikasikan.', en: 'Additional supply volumes exist only as free text and are not published.' }
  });

  add({
    k: 7, name: { id: 'Kesiapan pembayaran dan voucher pedagang', en: 'Trader payment and voucher readiness' }, cls: 'conditional',
    evid: { id: `Menerima tunai ${sv(optShare('t_payment', ['Tunai']))}, transfer ${sv(optShare('t_payment', ['Transfer']))}, QRIS ${sv(optShare('t_payment', ['QRIS']))} (n=${pairSafe('t_payment')}). Bersedia menerima voucher ${sv(optShare('t_voucher', ['Ya']))} dan bersyarat ${sv(optShare('t_voucher', ['Dengan Syarat']))}.`,
           en: `Accept cash ${sv(optShare('t_payment', ['Tunai']))}, transfer ${sv(optShare('t_payment', ['Transfer']))}, QRIS ${sv(optShare('t_payment', ['QRIS']))} (n=${pairSafe('t_payment')}). Willing to accept vouchers ${sv(optShare('t_voucher', ['Ya']))}, conditionally ${sv(optShare('t_voucher', ['Dengan Syarat']))}.` },
    risk: { id: `${sv(optShare('t_voucher', ['Tidak']))} menolak voucher dan hanya ${optShare('t_payment', ['Voucher'])?.n ?? 0} pedagang sudah menerima voucher hari ini, sehingga voucher menuntut pembangunan sistem baru.`, en: `${sv(optShare('t_voucher', ['Tidak']))} decline vouchers and only ${optShare('t_payment', ['Voucher'])?.n ?? 0} traders already accept them, so a voucher modality requires building a new system.` },
    mitig: { id: 'Prioritaskan tunai; jika voucher digunakan, sediakan kontrak, pelatihan rekonsiliasi, dan jaminan waktu pembayaran maksimal.', en: 'Prioritise cash; if vouchers are used, provide contracts, reconciliation training and a maximum payment-time guarantee.' },
    geo: { id: 'Tingkat pasar', en: 'Market level' },
    gap: { id: 'Syarat komersial pedagang berada pada teks bebas dan perlu negosiasi kontrak.', en: 'Traders’ commercial conditions sit in free text and require contract negotiation.' }
  });

  const lst = result('l_status');
  add({
    k: 8, name: { id: 'Status operasional penyedia layanan', en: 'Service provider operational status' }, cls: 'conditional',
    evid: { id: `${sv(optShare('l_status', ['Normal']))} beroperasi normal, ${sv(optShare('l_status', ['Terbatas']))} terbatas, ${sv(optShare('l_status', ['Tutup Sementara']))} tutup sementara (n=${lst.valid}).`,
           en: `${sv(optShare('l_status', ['Normal']))} operating normally, ${sv(optShare('l_status', ['Terbatas']))} limited, ${sv(optShare('l_status', ['Tutup Sementara']))} temporarily closed (n=${lst.valid}).` },
    risk: { id: 'Sampel mencampur penyedia keuangan dan non-keuangan (akomodasi, transportasi, telekomunikasi), sehingga angka ini bukan gambaran jaringan FSP.', en: 'The sample mixes financial and non-financial providers (accommodation, transport, telecom), so this figure is not a picture of the FSP network.' },
    mitig: { id: 'Asesmen FSP terpisah pada bank, kantor pos, koperasi, dan agen laku pandai di tiap kabupaten sasaran.', en: 'A separate FSP assessment of banks, post offices, cooperatives and banking agents in each target district.' },
    geo: { id: 'Tidak dapat dipecah per kabupaten (n<10 di setiap kabupaten)', en: 'Cannot be disaggregated by district (n<10 in every district)' },
    gap: { id: 'Tidak ada daftar cabang, agen aktif, atau titik layanan per kecamatan.', en: 'No list of branches, active agents or service points per sub-district.' }
  });

  const liq = result('l_liquidity');
  add({
    k: 9, name: { id: 'Likuiditas penyedia jasa keuangan', en: 'Financial service provider liquidity' }, cls: 'insufficient',
    evid: { id: `Modul likuiditas hanya berlaku dan dijawab oleh ${liq.valid} responden; ${optShare('l_liquidity', ['Ya'])?.n ?? 0} menjawab likuiditas cukup.`,
           en: `The liquidity module was applicable to and answered by only ${liq.valid} respondents; ${optShare('l_liquidity', ['Ya'])?.n ?? 0} answered that liquidity is sufficient.` },
    risk: { id: 'Keputusan penyaluran tunai skala besar tanpa konfirmasi likuiditas berisiko gagal bayar di titik penarikan.', en: 'Deciding on large-scale cash disbursement without liquidity confirmation risks payout failure at cash-out points.' },
    mitig: { id: 'Konfirmasi tertulis kapasitas kas dari kantor cabang, koordinasi dengan BI/OJK, dan uji penarikan skala kecil sebelum penyaluran penuh.', en: 'Written cash-capacity confirmation from branch offices, coordination with BI/OJK, and a small-scale payout test before full disbursement.' },
    geo: { id: 'Tidak dapat ditentukan', en: 'Cannot be determined' },
    gap: { id: 'Tidak ada data nilai kas, frekuensi pengisian, atau kapasitas agen.', en: 'No data on cash holdings, replenishment frequency or agent capacity.' }
  });

  add({
    k: 10, name: { id: 'Keandalan jaringan dan sistem', en: 'Network and system reliability' }, cls: 'insufficient',
    evid: { id: `Modul jaringan FSP dijawab oleh ${pairSafe('l_network')} responden. Dari sisi rumah tangga, ${sv(optShare('hh_fsp_barrier', ['Jaringan Tidak Stabil atau Terputus']))} menyebut jaringan tidak stabil sebagai hambatan layanan keuangan (n=${pairSafe('hh_fsp_barrier')}).`,
           en: `The FSP network module was answered by ${pairSafe('l_network')} respondents. On the household side, ${sv(optShare('hh_fsp_barrier', ['Jaringan Tidak Stabil atau Terputus']))} name unstable network as a barrier to financial services (n=${pairSafe('hh_fsp_barrier')}).` },
    risk: { id: 'Modalitas digital (e-wallet, voucher digital, QRIS) bergantung pada jaringan yang belum terverifikasi.', en: 'Digital modalities (e-wallet, digital voucher, QRIS) depend on a network that is not yet verified.' },
    mitig: { id: 'Uji sinyal per titik layanan; siapkan mekanisme cadangan berbasis tunai fisik atau agen.', en: 'Signal testing per service point; prepare a fallback based on physical cash or agents.' },
    geo: { id: 'Perlu pengujian per kecamatan', en: 'Requires testing per sub-district' },
    gap: { id: 'Tidak ada data uji jaringan per lokasi penyaluran.', en: 'No network test data per payout location.' }
  });

  const docs = result('hh_docs');
  add({
    k: 11, name: { id: 'Persyaratan dokumen', en: 'Documentation requirements' },
    cls: docs.sdc ? 'insufficient' : 'potential',
    evid: docs.sdc ? { id: 'Indikator sensitif; perlu agregasi kabupaten.', en: 'Sensitive indicator; requires district aggregation.' }
      : { id: `${sv(optShare('hh_docs', ['Lengkap']))} rumah tangga menyatakan dokumen kependudukan lengkap; ${sv(optShare('hh_docs', ['Sebagian Hilang/Rusak', 'Tidak Ada']))} kehilangan sebagian atau seluruh dokumen (n=${docs.valid}). Mekanisme penggantian dokumen dinyatakan tersedia oleh ${optShare('p_dukcapil', ['Ya'])?.n ?? 0} dari ${pairSafe('p_dukcapil')} instansi yang berlaku.`,
           en: `${sv(optShare('hh_docs', ['Lengkap']))} of households report complete civil documentation; ${sv(optShare('hh_docs', ['Sebagian Hilang/Rusak', 'Tidak Ada']))} lost some or all documents (n=${docs.valid}). A replacement mechanism is reported available by ${optShare('p_dukcapil', ['Ya'])?.n ?? 0} of ${pairSafe('p_dukcapil')} applicable institutions.` },
    risk: { id: 'Rumah tangga tanpa dokumen berisiko tereksklusi dari penyaluran berbasis rekening atau KTP.', en: 'Households without documents risk exclusion from account-based or ID-based disbursement.' },
    mitig: { id: 'Prosedur alternatif verifikasi identitas yang disepakati dengan FSP dan Dukcapil; layanan jemput bola penerbitan dokumen.', en: 'Alternative identity-verification procedures agreed with FSPs and Dukcapil; outreach document-issuance services.' },
    geo: { id: 'Tingkat kabupaten', en: 'District level' },
    gap: { id: 'Tidak ada data jenis dokumen spesifik yang hilang.', en: 'No data on which specific documents were lost.' }
  });

  add({
    k: 12, name: { id: 'Inklusi lansia dan penyandang disabilitas', en: 'Inclusion of older people and persons with disabilities' }, cls: 'conditional',
    evid: { id: `Penyedia layanan: ${sv(optShare('l_inclusive', ['Ya']))} menyatakan layanan dapat diakses kelompok tersebut, ${sv(optShare('l_inclusive', ['Tidak']))} tidak (n=${pairSafe('l_inclusive')}). Pedagang: ${sv(optShare('t_vulnerable', ['Ya']))} menyatakan dapat melayani kelompok rentan secara setara (n=${pairSafe('t_vulnerable')}).`,
           en: `Service providers: ${sv(optShare('l_inclusive', ['Ya']))} state their service is accessible to these groups, ${sv(optShare('l_inclusive', ['Tidak']))} do not (n=${pairSafe('l_inclusive')}). Traders: ${sv(optShare('t_vulnerable', ['Ya']))} state they can serve vulnerable groups equally (n=${pairSafe('t_vulnerable')}).` },
    risk: { id: 'Penilaian bersifat penilaian diri penyedia, belum divalidasi dengan pengalaman pengguna lansia dan penyandang disabilitas.', en: 'These are provider self-assessments, not validated against the experience of older people and persons with disabilities.' },
    mitig: { id: 'Audit aksesibilitas titik penyaluran; opsi perwakilan penerima; pengantaran untuk rumah tangga tanpa mobilitas.', en: 'Accessibility audit of payout points; authorised-representative option; delivery for households without mobility.' },
    geo: { id: 'Tingkat titik layanan', en: 'Service-point level' },
    gap: { id: 'Tidak ada modul Washington Group Questions untuk mengukur disabilitas secara standar.', en: 'No Washington Group Questions module to measure disability in a standard way.' }
  });

  add({
    k: 13, name: { id: 'Risiko perlindungan dan keamanan', en: 'Protection and security risks' }, cls: 'conditional',
    evid: { id: `Rumah tangga: ${sv(optShare('hh_conflict', ['Tidak']))} menyatakan tidak ada risiko konflik, ${sv(optShare('hh_conflict', ['Ya', 'Mungkin']))} menyatakan ada atau mungkin, ${sv(optShare('hh_conflict', ['Memilih Tidak Menjawab']))} memilih tidak menjawab. Keamanan sebagai hambatan pasar: ${sv(optShare('hh_barrier', ['Keamanan']))}.`,
           en: `Households: ${sv(optShare('hh_conflict', ['Tidak']))} report no conflict risk, ${sv(optShare('hh_conflict', ['Ya', 'Mungkin']))} report a risk or possible risk, ${sv(optShare('hh_conflict', ['Memilih Tidak Menjawab']))} preferred not to answer. Security as a market barrier: ${sv(optShare('hh_barrier', ['Keamanan']))}.` },
    risk: { id: 'Pertanyaan sensitif berpotensi under-reported; pemerintah dan NGO justru menempatkan keamanan sebagai risiko tinggi.', en: 'A sensitive question is likely under-reported; government and NGO respondents rank security as a high risk.' },
    mitig: { id: 'Penilaian risiko perlindungan terpisah; penyaluran tanpa antrean panjang; mekanisme pengaduan rahasia; informasi penerima tidak diumumkan terbuka.', en: 'A separate protection risk assessment; payouts without long queues; a confidential complaints channel; no public posting of beneficiary lists.' },
    geo: { id: 'Tingkat desa (tidak dipublikasikan pada dashboard ini)', en: 'Village level (not published in this dashboard)' },
    gap: { id: 'Tidak ada data insiden aktual maupun analisis risiko berbasis gender.', en: 'No actual incident data and no gender-based risk analysis.' }
  });

  add({
    k: 14, name: { id: 'Risiko penipuan dan eksklusi', en: 'Fraud and exclusion risks' }, cls: 'conditional',
    evid: { id: `Pemerintah menempatkan penipuan sebagai risiko utama ${sv(optShare('p_cva_risk', ['Penipuan']))} dan eksklusi ${sv(optShare('p_cva_risk', ['Eksklusi']))} (n=${pairSafe('p_cva_risk')}). Rumah tangga tanpa program perlindungan sosial: ${sv(optShare('hh_sp_prog', ['Tidak Ada/Tidak Tahu']))}. Duplikasi disebut oleh ${optShare('n_cva_risk', ['Duplikasi'])?.n ?? 0} dari ${pairSafe('n_cva_risk')} NGO.`,
           en: `Government ranks fraud as a main risk ${sv(optShare('p_cva_risk', ['Penipuan']))} and exclusion ${sv(optShare('p_cva_risk', ['Eksklusi']))} (n=${pairSafe('p_cva_risk')}). Households in no social protection programme: ${sv(optShare('hh_sp_prog', ['Tidak Ada/Tidak Tahu']))}. Duplication named by ${optShare('n_cva_risk', ['Duplikasi'])?.n ?? 0} of ${pairSafe('n_cva_risk')} NGOs.` },
    risk: { id: 'Penargetan berbasis data bantuan sosial saja akan melewatkan rumah tangga terdampak yang belum terdaftar.', en: 'Targeting based only on social-assistance data will miss affected households that are not registered.' },
    mitig: { id: 'Verifikasi penerima lintas lembaga sebelum penyaluran; kriteria penargetan berbasis dampak, bukan hanya status bansos; deduplikasi melalui Pokja BaNTu.', en: 'Cross-agency beneficiary verification before disbursement; impact-based targeting criteria rather than social-assistance status alone; deduplication through the BaNTu working group.' },
    geo: { id: 'Lintas kabupaten', en: 'Cross-district' },
    gap: { id: 'Tidak ada daftar penerima lintas lembaga yang dapat dibandingkan saat ini.', en: 'No comparable cross-agency beneficiary list exists at present.' }
  });

  const gv = result('p_cva_feasible');
  add({
    k: 15, name: { id: 'Penerimaan pemerintah', en: 'Government acceptance' }, cls: 'potential',
    evid: { id: `${sv(optShare('p_cva_feasible', ['Ya']))} menilai layak dan ${sv(optShare('p_cva_feasible', ['Ya Dengan Syarat']))} layak dengan syarat; ${sv(optShare('p_cva_feasible', ['Tidak']))} menilai tidak layak (n=${gv.valid}).`,
           en: `${sv(optShare('p_cva_feasible', ['Ya']))} assess CVA as feasible and ${sv(optShare('p_cva_feasible', ['Ya Dengan Syarat']))} as conditionally feasible; ${sv(optShare('p_cva_feasible', ['Tidak']))} assess it as not feasible (n=${gv.valid}).` },
    risk: { id: 'Penerimaan tidak seragam antar instansi dan bukan izin formal; instansi yang menolak perlu dialog.', en: 'Acceptance is uneven across institutions and is not formal authorisation; dissenting institutions need dialogue.' },
    mitig: { id: 'Nota kesepahaman dengan BPBD dan Dinas Sosial; penyelarasan dengan skema bantuan pemerintah yang berjalan.', en: 'A memorandum of understanding with BPBD and the Social Affairs Office; alignment with existing government assistance schemes.' },
    geo: { id: `Instansi terkaji di ${Object.keys(countBy('kab', 'GOV')).length} kabupaten`, en: `Institutions assessed in ${Object.keys(countBy('kab', 'GOV')).length} districts` },
    gap: { id: 'Alasan penolakan hanya tersedia pada teks bebas dan tidak dipublikasikan.', en: 'Reasons for objection exist only in free text and are not published.' }
  });

  const ng = result('n_cva_plan');
  add({
    k: 16, name: { id: 'Kesiapan koordinasi NGO', en: 'NGO coordination readiness' }, cls: 'insufficient',
    evid: { id: `Hanya ${ng.valid} NGO terkaji. Rencana CVA: ${ng.rows.filter(r => r.n > 0).map(r => `${r.label} ${r.n}`).join(', ') || '–'}. Kebutuhan koordinasi tertinggi: perlindungan data dan penyelarasan.`,
           en: `Only ${ng.valid} NGOs were assessed. CVA plans: ${ng.rows.filter(r => r.n > 0).map(r => `${r.label} ${r.n}`).join(', ') || '–'}. Highest coordination needs: data protection and alignment.` },
    risk: { id: 'Dengan n=4, tidak ada dasar untuk menyimpulkan kapasitas atau cakupan respons NGO secara keseluruhan.', en: 'With n=4 there is no basis for concluding anything about overall NGO capacity or response coverage.' },
    mitig: { id: 'Pemetaan 4W lengkap melalui Pokja BaNTu sebelum penyelarasan nilai transfer dan pembagian wilayah.', en: 'A complete 4W mapping through the BaNTu working group before transfer-value alignment and geographic division.' },
    geo: { id: 'Tidak representatif', en: 'Not representative' },
    gap: { id: 'Cakupan respons, nilai transfer, dan jadwal antar lembaga belum terdata.', en: 'Response coverage, transfer values and timelines across agencies are not yet recorded.' }
  });

  add({
    k: 17, name: { id: 'Pemantauan dan mekanisme pengaduan', en: 'Monitoring and complaints mechanisms' }, cls: 'insufficient',
    evid: { id: 'Asesmen ini tidak memuat pertanyaan tertutup tentang keberadaan atau kualitas mekanisme umpan balik. Informasi hanya tersedia sebagai teks bebas pada modul NGO dan tidak dipublikasikan.',
           en: 'This assessment contains no closed question on the existence or quality of feedback mechanisms. The information exists only as free text in the NGO module and is not published.' },
    risk: { id: 'Tanpa mekanisme pengaduan yang berfungsi, risiko eksklusi dan penyalahgunaan tidak dapat dideteksi lebih awal.', en: 'Without a functioning complaints mechanism, exclusion and misuse risks cannot be detected early.' },
    mitig: { id: 'Bangun saluran pengaduan bersama lintas lembaga sebelum penyaluran; sertakan indikator PDM sejak desain program.', en: 'Establish a shared cross-agency complaints channel before disbursement; include PDM indicators from programme design.' },
    geo: { id: 'Tidak dapat ditentukan', en: 'Cannot be determined' },
    gap: { id: 'Perlu pertanyaan tertutup pada ronde asesmen berikutnya.', en: 'A closed question is needed in the next assessment round.' }
  });

  return F17;
}

/* ---------------------------------------------------------------- recommendations */
function recommendations() {
  return [
    { p: 'Tinggi', a: { id: 'Verifikasi ulang satuan biaya transportasi rumah tangga (R15) dan satuan produk pedagang (U12); terbitkan dataset terkoreksi.', en: 'Re-verify the household transport-cost unit (R15) and the trader product unit (U12); publish a corrected dataset.' }, who: { id: 'Tim MEAL gabungan · lembaga pengumpul data', en: 'Joint MEAL team · data-collecting agencies' }, when: { id: '3 hari', en: '3 days' } },
    { p: 'Tinggi', a: { id: 'Lakukan asesmen FSP khusus (bank, kantor pos, koperasi, agen laku pandai) termasuk konfirmasi likuiditas tertulis dan uji jaringan per titik layanan.', en: 'Run a dedicated FSP assessment (banks, post offices, cooperatives, banking agents) including written liquidity confirmation and per-site network testing.' }, who: { id: 'Pokja BaNTu · lembaga pemimpin CVA', en: 'BaNTu working group · CVA lead agency' }, when: { id: '7 hari', en: '7 days' } },
    { p: 'Tinggi', a: { id: 'Hitung MEB dan nilai transfer berbasis harga pasar lokal; sepakati satu nilai transfer lintas lembaga.', en: 'Calculate an MEB and transfer value from local market prices; agree one transfer value across agencies.' }, who: { id: 'Pokja BaNTu · Klaster Logistik', en: 'BaNTu working group · Logistics Cluster' }, when: { id: '10 hari', en: '10 days' } },

/* ==========================================================================
   CROSS-GROUP COMPARISON TABLE — figures only, no verdict.
   Complements the triangulation matrix above: the same themes laid out as bare
   numbers so the figures from different respondent groups can be read against
   each other at a glance.
   ========================================================================== */
function cmpCell(s) {
  if (!s || s.pct === null) return `<td class="num cmp-na">–</td>`;
  return `<td class="num"><span class="cmp-v">${fmt(s.pct)}%</span>
    <span class="cmp-n">${s.n}/${s.denom}${s.denom < CAU() ? ' ⚠' : ''}</span></td>`;
}
function pairShareUp(id) {
  const p = pairStats(id);
  if (p.blocked || p.empty) return ZERO;
  const n = p.up + p.same;
  return { pct: p.n ? 100 * n / p.n : null, n, denom: p.n, base: p.base };
}
function pairShareSame(id) {
  const p = pairStats(id);
  if (p.blocked || p.empty) return ZERO;
  return { pct: p.n ? 100 * p.same / p.n : null, n: p.same, denom: p.n, base: p.base };
}

function comparisonTable() {

      ]

        { g: 'HH', m: { id: 'keamanan menjadi hambatan pasar', en: 'security as market barrier' }, v: optShare('hh_barrier', ['Keamanan']) },

        { g: 'NGO', m: { id: 'keamanan menjadi risiko CVA', en: 'security as CVA risk' }, v: optShare('n_cva_risk', ['Keamanan']) }
      ]
