  return `<div class="card"><h3>${L('Perbandingan angka antar kelompok responden', 'Comparison across respondent groups')}</h3>
    <p class="card-sub">${L('Persentase jawaban valid per kelompok · ⚠ menandai n di bawah 10', 'Share of valid responses per group · ⚠ marks n below 10')}</p>
    <div class="tbl-wrap"><table class="tbl cmp">
      <thead><tr><th scope="col">${L('Tema', 'Theme')}</th><th scope="col">${L('Kelompok', 'Group')}</th>
        <th scope="col">${L('Ukuran', 'Measure')}</th><th scope="col" class="num">${L('Nilai', 'Value')}</th></tr></thead>
      <tbody>${rows.map(r => r.cells.map((c, i) => `<tr${i === 0 ? ' class="cmp-top"' : ''}>

    + `<div class="grid g-3 mb">${stacked('p_demand')}${stacked('p_avail')}${stacked('p_price')}</div>`

    + `<div class="grid g-2 mb">${hbar('p_policy')}${hbar('p_budget')}</div>`
    + `<div class="grid g-2 mb">${stacked('p_cva_feasible')}${hbar('p_cva_risk')}</div>`
    + `<div class="grid g-2">${box('p_reopen_pct')}${stacked('p_dukcapil')}</div>`;
}

/* ---------------------------------------------------------------- 9 ngo */
function secNGO() {
  const n = recordCount('NGO');
  return head('NGO dan OMS', 'NGOs and CSOs',
    grpMeta('NGO') + `<span class="sm warnmeta">${L('n=' + n + ', disajikan sebagai jumlah absolut', 'n=' + n + ', shown as absolute counts')}</span>`)
    + `<div class="grid g-kpi mb">
        ${kpi(L('NGO terkaji', 'NGOs assessed'), fmt(n, 0), '', 'missing')}
        ${kpi(L('Respons berjalan', 'Response under way'), fmt(optShare('n_responding', ['Sudah Berjalan']).n, 0),
          `${L('dari', 'of')} ${pairSafe('n_responding')}`, 'info')}
        ${kpi(L('Merencanakan CVA', 'Planning CVA'), fmt(optShare('n_cva_plan', ['Tunai', 'Voucher', 'Kombinasi']).n, 0),
          `${L('dari', 'of')} ${pairSafe('n_cva_plan')}`, 'caution')}

}

/* ---------------------------------------------------------------- 10 cva */
function secCVA() {
  return head('Kesiapan Tunai dan Voucher', 'Cash and Voucher Readiness',
    grpMeta('HH', 'TRD', 'FSP', 'GOV', 'NGO'))
    + `<div class="grid g-kpi mb">
        ${kpiFrom('hh_account', L('RT punya akun keuangan', 'Households with an account'))}
        ${kpi(L('Tunai fisik dapat diakses', 'Physical cash accessible'),
          sv(optShare('hh_method_access', ['Tunai Fisik'])),
          `${optShare('hh_method_access', ['Tunai Fisik']).n}/${pairSafe('hh_method_access')}`, 'ok')}
        ${kpiFrom('hh_cva_know', L('Tahu cara pakai bantuan dengan aman', 'Know how to use assistance safely'))}
        ${kpiFrom('t_voucher', L('Pedagang terima voucher', 'Traders accept vouchers'))}
        ${kpiFrom('l_willing', L('FSP bersedia bekerja sama', 'FSPs willing to cooperate'))}
        ${kpiFrom('p_cva_feasible', L('Pemerintah nilai layak', 'Government finds it feasible'))}

    + comparisonTable()
    + `<div style="margin-top:16px">${cvaMatrix()}</div>`
    + `<div class="grid g-2 mb" style="margin-top:16px">${stacked('hh_modality_pref')}${hbar('hh_method_access')}</div>`
    + `<div class="grid g-2 mb">${stacked('hh_account')}${stacked('hh_fsp_access')}</div>`
    + `<div class="grid g-2 mb">${hbar('hh_fsp_barrier')}${hbar('hh_fsp_used')}</div>`
    + `<div class="grid g-3 mb">${stacked('hh_docs')}${stacked('hh_cva_know')}${stacked('hh_conflict')}</div>`
    + `<div class="grid g-2 mb">${hbar('p_cva_risk')}${hbar('n_cva_risk', { sort: false })}</div>`
    + `<div class="grid g-2">${stacked('t_voucher')}${stacked('l_willing')}</div>`;
}

/** Five household readiness indicators laid out per kabupaten.
 *  Each row states which response options form its numerator, because the
 *  headline answer differs per question: preferring cash is not the same kind
 *  of statement as holding complete civil documentation. */
function cvaMatrix() {
  const rows = [
    {
      id: 'hh_modality_pref', keys: ['Tunai', 'Kombinasi'],
      label: { id: 'Bentuk bantuan diharapkan: tunai atau kombinasi', en: 'Preferred modality: cash or combination' }
    },
    {
      id: 'hh_account', keys: ['Ya'],
      label: { id: 'Memiliki rekening/akun keuangan aktif', en: 'Has an active financial account' }
    },
    {
      id: 'hh_fsp_access', keys: ['Ya'],
      label: { id: 'Dapat mengakses layanan keuangan saat ini', en: 'Can currently access financial services' }
    },
    {
      id: 'hh_docs', keys: ['Lengkap'],
      label: { id: 'Dokumen kependudukan lengkap', en: 'Complete civil documentation' }
    },
    {
      id: 'hh_cva_know', keys: ['Ya'],
      label: { id: 'Tahu cara menggunakan bantuan dengan aman', en: 'Knows how to use assistance safely' }

  return heatmap(rows,
    L('Kesiapan rumah tangga per kabupaten', 'Household readiness by district'),
    L('Persentase jawaban valid rumah tangga di tiap kabupaten · sel dengan jawaban valid kurang dari 5 disuppress',
      'Share of valid household responses in each district · cells with fewer than 5 valid responses are suppressed'),
    { exportId: 'cva-kabupaten', file: 'kesiapan-cva-per-kabupaten' });
}

/* ---------------------------------------------------------------- registry */
const NAV_LABELS = {
  overview:  { label_id: 'Ringkasan',           label_en: 'Overview' },

const SECTIONS_UI = [

];

const ICONS = {

</script>
<script>
/* ==== app.js ==== */
/* ==========================================================================
   APP — wiring only. Boot, hash routing, filter controls, theme, language,
   CSV export. No calculations live here; those sit in data.js.
   ========================================================================== */
let ACTIVE = location.hash.replace('#', '') || 'overview';

/* ---------------------------------------------------------------- nav */
function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = SECTIONS_UI.map(s => {
    const meta = NAV_LABELS[s.id] || DATA.meta.sections.find(x => x.id === s.id)
      || { label_id: s.id, label_en: s.id };
    const label = LANG === 'en' ? meta.label_en : meta.label_id;
    return `<button class="nav-item" role="tab" data-sec="${s.id}"
      aria-selected="${s.id === ACTIVE}" aria-controls="main">
      <svg viewBox="0 0 24 24" class="ic">${ICONS[s.icon]}</svg><span>${esc(label)}</span></button>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(b => {
    b.addEventListener('click', () => go(b.dataset.sec));
    b.addEventListener('keydown', e => {
      const items = [...nav.querySelectorAll('.nav-item')];
      const i = items.indexOf(b);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus();
      }
    });
  });
}

function go(id) {
  ACTIVE = id;
  // A sandboxed iframe (about:srcdoc, e.g. an in-chat preview) has an opaque
  // origin and throws SecurityError on history writes. Deep links are a nicety,
  // so losing them there must not stop navigation.
  try {
    history.replaceState(null, '', '#' + id);
  } catch (e) {
    /* no deep-link support in this embedding context */
  }
  document.body.classList.remove('nav-open');
  document.getElementById('burger').setAttribute('aria-expanded', 'false');
  document.querySelectorAll('.nav-item').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.sec === id)));
  render();
  document.getElementById('main').focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ---------------------------------------------------------------- filters */
/* Each dimension is a button that opens a panel of clickable checkboxes with
   live record counts. A native <select multiple> was replaced because it needs
   ctrl-click to combine values, shows only three or four rows at a time, cannot
   display counts, and is close to unusable on a touch screen. */

let OPEN_PANEL = null;

function selectField(key, labelKey, values, labelFn, dim) {
  const chosen = F[key];
  const counts = dim ? countBy(dim) : {};
  const summary = chosen.length === 0
    ? t('all')
    : (chosen.length === 1 ? (labelFn ? labelFn(chosen[0]) : chosen[0])
      : `${chosen.length} ${LANG === 'en' ? 'selected' : 'dipilih'}`);
  const searchable = values.length > 12;

  return `<div class="fld" data-fld="${key}">
    <label id="lb-${key}">${t(labelKey)}</label>
    <button type="button" class="fsel" data-open="${key}" aria-expanded="false"
      aria-haspopup="true" aria-labelledby="lb-${key}">
      <span class="fsel-txt${chosen.length ? ' on' : ''}">${esc(summary)}</span>
      <svg viewBox="0 0 24 24" class="ic fsel-ic"><path d="M6 9.5l6 6 6-6"/></svg>
    </button>
    <div class="fpanel" id="fp-${key}" role="group" aria-labelledby="lb-${key}" hidden>
      ${searchable ? `<input type="search" class="fsearch" data-search="${key}"
        placeholder="${LANG === 'en' ? 'Search…' : 'Cari…'}" aria-label="${LANG === 'en' ? 'Search options' : 'Cari pilihan'}">` : ''}
      <div class="fpanel-acts">
        <button type="button" class="link" data-all="${key}">${LANG === 'en' ? 'Select all' : 'Pilih semua'}</button>
        <button type="button" class="link" data-none="${key}">${LANG === 'en' ? 'Clear' : 'Kosongkan'}</button>
      </div>
      <div class="fopts">
        ${values.map(v => {
          const lab = labelFn ? labelFn(v) : v;
          const n = counts[v];
          return `<label class="fopt" data-label="${esc(String(lab).toLowerCase())}">
            <input type="checkbox" data-f="${key}" value="${esc(v)}" ${chosen.includes(v) ? 'checked' : ''}>
            <span class="fopt-t">${esc(lab)}</span>
            ${n !== undefined ? `<span class="fopt-n">${n}</span>` : ''}
          </label>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function closePanels(except) {
  document.querySelectorAll('.fpanel').forEach(p => {
    if (p.id !== 'fp-' + except) p.hidden = true;
  });
  document.querySelectorAll('.fsel').forEach(b => {
    if (b.dataset.open !== except) b.setAttribute('aria-expanded', 'false');
  });
  if (OPEN_PANEL !== except) OPEN_PANEL = except || null;
}

function buildFilters() {
  const m = DATA.meta;
  // sub-districts offered are restricted to the districts already selected
  const kecs = F.kab.length
    ? F.kab.flatMap(k => m.kabupaten_kecamatan[k] || [])
    : Object.values(m.kabupaten_kecamatan).flat();

  document.getElementById('fb-grid').innerHTML =
    selectField('kab', 'f_kab', m.kabupaten, null, 'kab') +
    selectField('kec', 'f_kec', [...new Set(kecs)].sort(), null, 'kec') +
    selectField('grp', 'f_grp', Object.keys(m.records_by_group), g => m.group_labels[g][LANG] || g, 'grp') +
    selectField('org', 'f_org', m.organisations, null, 'org') +
    selectField('cat', 'f_cat', m.product_categories, tOpt, 'cat') +
    selectField('mth', 'f_mth', m.methods, tOpt, 'mth');

  // open / close a panel
  document.querySelectorAll('.fsel').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const k = b.dataset.open;
    const p = document.getElementById('fp-' + k);
    const willOpen = p.hidden;
    closePanels(willOpen ? k : null);
    p.hidden = !willOpen;
    b.setAttribute('aria-expanded', String(willOpen));
    if (willOpen) {
      const s = p.querySelector('.fsearch');
      if (s) s.focus();
    }
  }));
  document.querySelectorAll('.fpanel').forEach(p => p.addEventListener('click', e => e.stopPropagation()));

  // checkbox change
  document.querySelectorAll('[data-f]').forEach(cb => cb.addEventListener('change', () => {
    const k = cb.dataset.f;
    const set = new Set(F[k]);
    cb.checked ? set.add(cb.value) : set.delete(cb.value);
    F[k] = [...set];
    if (k === 'kab') {
      F.kec = F.kec.filter(c => F.kab.some(kk => (DATA.meta.kabupaten_kecamatan[kk] || []).includes(c)));
    }
    refresh(k);
  }));

  // select all / clear within one dimension
  document.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.all;
    F[k] = [...document.querySelectorAll(`input[data-f="${k}"]`)].map(x => x.value);
    refresh(k);
  }));
  document.querySelectorAll('[data-none]').forEach(b => b.addEventListener('click', () => {
    F[b.dataset.none] = [];
    refresh(b.dataset.none);
  }));

  // in-panel search
  document.querySelectorAll('.fsearch').forEach(s => s.addEventListener('input', () => {
    const q = s.value.trim().toLowerCase();
    s.closest('.fpanel').querySelectorAll('.fopt').forEach(o => {
      o.style.display = !q || o.dataset.label.includes(q) ? '' : 'none';
    });
  }));

  if (OPEN_PANEL) {
    const p = document.getElementById('fp-' + OPEN_PANEL);
    const b = document.querySelector(`.fsel[data-open="${OPEN_PANEL}"]`);
    if (p && b) { p.hidden = false; b.setAttribute('aria-expanded', 'true'); }
  }
}

/** Rebuild the filter bar and the page after a filter change, keeping the panel
 *  the person is working in open so they can tick several values in a row. */
function refresh(keepOpen) {
  OPEN_PANEL = keepOpen || null;
  buildFilters();
  renderChips();
  render();
}

function renderChips() {
  const box = document.getElementById('chips');
  const items = [];
  const push = (key, label, v, disp) => items.push(
    `<span class="chip">${label}: ${esc(disp || v)}<button data-rm="${key}" data-v="${esc(v)}"
      aria-label="Hapus filter ${esc(disp || v)}">×</button></span>`);
  F.kab.forEach(v => push('kab', t('f_kab'), v));
  F.kec.forEach(v => push('kec', t('f_kec'), v));
  F.grp.forEach(v => push('grp', t('f_grp'), v, DATA.meta.group_labels[v][LANG] || v));
  F.org.forEach(v => push('org', t('f_org'), v));
  F.cat.forEach(v => push('cat', t('f_cat'), v, tOpt(v)));
  F.mth.forEach(v => push('mth', t('f_mth'), v, tOpt(v)));
  box.innerHTML = items.length ? items.join('') : `<span class="chip empty">${t('nofilter')}</span>`;
  box.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.rm;
    if (Array.isArray(F[k])) F[k] = F[k].filter(x => x !== b.dataset.v); else F[k] = '';
    refresh(null);
  }));

  const sel = recordCount(), tot = DATA.meta.total_records;
  document.getElementById('fb-count').innerHTML =
    `<b>${sel}</b> ${t('of')} ${tot} ${t('records')} ${t('filtered')}`;
}

function resetFilters() {
  F.kab = []; F.kec = []; F.grp = []; F.org = []; F.cat = []; F.mth = [];
  refresh(null);
}

/* ---------------------------------------------------------------- render */
function render() {
  const main = document.getElementById('main');
  if (main) main.dataset.activeSec = ACTIVE;
  document.body.dataset.activeSec = ACTIVE;
  const s = SECTIONS_UI.find(x => x.id === ACTIVE) || SECTIONS_UI[0];
  try {
    main.innerHTML = s.build();
    animateNumbers();
    initChartAnimations();
    if (ACTIVE === 'overview') {
      initSignalsScroll();
    }
  } catch (err) {
    document.getElementById('main').innerHTML =
      `<div class="card"><h3>${L('Bagian ini gagal dimuat', 'This section failed to load')}</h3>
       <p class="card-sub">${esc(String(err && err.message || err))}</p>
       <p class="card-sub">${L('Coba atur ulang filter.', 'Try resetting the filters.')}</p></div>`;
    console.error(err);
  }
}

function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.documentElement.lang = LANG;
  document.querySelectorAll('.seg [data-lang]').forEach(b => {
    const on = b.dataset.lang === LANG;
    b.setAttribute('aria-pressed', String(on));
    b.title = t(b.dataset.lang === 'id' ? 'langId' : 'langEn');
  });
  setThemeIcon();
}

/** Language is a two-state segmented control rather than a toggle, so the
 *  active language is visible without having to read the button as an action. */
function setLang(next) {
  if (next === LANG) return;
  LANG = next;
  localStorage.setItem('jma-lang', LANG);
  buildNav();
  applyStaticI18n();
  refresh(null);
}

/* ---------------------------------------------------------------- covers */
/** Front and closing covers share one controller. Both are overlays rather
 *  than pages, so opening either never reloads and never clears the filters.
 *  Only one can be open at a time, and focus is returned to the control that
 *  opened it when it closes. */
function initCovers() {
  const cover = document.getElementById('cover');
  const closing = document.getElementById('closing');
  if (!cover || !closing) return;
  let lastFocus = null;

  const open = (el, focusEl) => {
    [cover, closing].forEach(x => { if (x !== el) hide(x, false); });
    el.hidden = false;
    requestAnimationFrame(() => {
      el.classList.remove('gone');
      document.body.classList.add('cover-on');
      (focusEl || el.querySelector('.btn-primary')).focus({ preventScroll: true });
    });
  };
  const hide = (el, restore = true) => {
    if (el.hidden) return;
    el.classList.add('gone');
    window.setTimeout(() => { el.hidden = true; }, 520);
    document.body.classList.remove('cover-on');
    if (restore) {
      // On first entry there is nothing to return to, so focus moves to the
      // content itself rather than drawing a focus ring on the first nav item.
      const target = lastFocus || document.getElementById('main');
      if (target) target.focus({ preventScroll: true });
      lastFocus = null;
    }
  };
  const openFrom = (el, btn) => { lastFocus = btn; open(el); };

  // the front cover is already in the markup and visible on load
  document.body.classList.add('cover-on');
  document.getElementById('btn-enter').addEventListener('click', () => hide(cover));
  document.getElementById('btn-cover-x').addEventListener('click', () => hide(cover));
  document.getElementById('btn-closing-x').addEventListener('click', () => hide(closing));
  document.getElementById('btn-closing-back').addEventListener('click', () => hide(closing));

  const sampul = document.getElementById('btn-cover-top');
  const penutup = document.getElementById('btn-closing-top');
  document.getElementById('btn-cover-open').addEventListener('click', e => openFrom(cover, e.currentTarget));
  sampul.addEventListener('click', e => openFrom(cover, e.currentTarget));
  penutup.addEventListener('click', e => openFrom(closing, e.currentTarget));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!cover.hidden) hide(cover);
    else if (!closing.hidden) hide(closing);
  });

  document.getElementById('btn-enter').focus({ preventScroll: true });
}

/* ------------------------------------------------------- collapsible chrome */
/** Sidebar and filter bar both collapse, because on a laptop they together
 *  take roughly a third of the viewport before a single figure is visible.
 *  Both states persist, so the layout the person chose survives a reload. */
function initChrome() {
  const sb = document.getElementById('btn-sb');
  const fb = document.getElementById('btn-fb');

  const setSb = on => {
    document.body.classList.toggle('sb-collapsed', on);
    sb.setAttribute('aria-expanded', String(!on));
    sb.setAttribute('aria-label', on ? t('sbOpen') : t('sbClose'));
    sb.title = on ? t('sbOpen') : t('sbClose');
    document.getElementById('burger').setAttribute('aria-label', on ? t('sbOpen') : t('menu'));
    localStorage.setItem('jma-sb', on ? '1' : '0');
  };
  const setFb = on => {
    document.body.classList.toggle('fb-collapsed', on);
    fb.setAttribute('aria-expanded', String(!on));
    fb.setAttribute('aria-label', on ? t('filterOpen') : t('filterClose'));
    localStorage.setItem('jma-fb', on ? '1' : '0');
  };

  setSb(localStorage.getItem('jma-sb') === '1');
  // Filters start hidden: they cost roughly 180px of vertical space before a
  // single figure is visible. Only an explicit choice to open them is stored.
  setFb(localStorage.getItem('jma-fb') !== '0');

  sb.addEventListener('click', () => setSb(!document.body.classList.contains('sb-collapsed')));
  fb.addEventListener('click', () => setFb(!document.body.classList.contains('fb-collapsed')));
  window.jmaSetSb = setSb;
}

/* ---------------------------------------------------------------- controls */
function initTheme() {
  const saved = localStorage.getItem('jma-theme');
  const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  setThemeIcon();
}
function setThemeIcon() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const btn = document.getElementById('btn-theme');
  if (btn) {
    btn.setAttribute('aria-pressed', String(dark));
    const lab = dark ? t('themeToLight') : t('themeToDark');
    btn.setAttribute('aria-label', lab);
    btn.title = lab;
  }
  document.getElementById('ic-theme').innerHTML = dark
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
}

/** Shared CSV download. */
function saveCSV(text, name) {
  const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/** Download buttons are added by the chart components after every render, so
 *  they are handled by one delegated listener rather than rebound each time. */
function bindCardActions() {
  document.getElementById('main').addEventListener('click', e => {
    const dl = e.target.closest('[data-dl]');
    if (dl) { saveCSV(indicatorCSV(dl.dataset.dl), 'jma-' + dl.dataset.dl); return; }
    const mx = e.target.closest('[data-dlmatrix]');
    if (mx) { saveCSV(EXPORTS[mx.dataset.dlmatrix] || '', 'jma-' + (mx.dataset.name || 'matriks')); return; }
    const tip = e.target.closest('.tip');
    if (tip) {
      const open = tip.classList.toggle('open');
      document.querySelectorAll('.tip.open').forEach(x => { if (x !== tip) x.classList.remove('open'); });
      tip.setAttribute('aria-expanded', String(open));
    }
  });
}

/** Count-up reveal for KPI values. Runs once per element and always lands on
 *  the exact rendered value, so the figure on screen is never approximated. */
function animateNumbers() {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.kpi-val[data-num]').forEach(el => {
    if (el.dataset.done) return;
    el.dataset.done = '1';
    const target = parseFloat(el.dataset.num);
    const final = el.textContent;
    if (reduce || !isFinite(target) || target === 0) return;
    const isPct = el.dataset.fmt === 'pct';
    const dur = 520, t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = isPct ? fmt(target * e, 1) + '%' : fmt(Math.round(target * e), 0);
      if (p < 1) requestAnimationFrame(step); else el.textContent = final;
    };
    requestAnimationFrame(step);
  });
}

let chartObserver = null;
function initChartAnimations() {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const targets = document.querySelectorAll('.bars, .stack, .bar-row');
  if (reduce || !('IntersectionObserver' in window)) {
    targets.forEach(el => el.classList.add('anim-in'));
    return;
  }
  if (chartObserver) chartObserver.disconnect();
  chartObserver = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('anim-in');
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px 50px 0px' });

  targets.forEach(el => chartObserver.observe(el));
}

function downloadCSV() { saveCSV(buildCSV(), 'jma-flores-2026-agregat'); }

/* ---------------------------------------------------------------- signals scroll & print all */
function initSignalsScroll() {
  const el = document.getElementById('signals-scroll');
  if (!el || el.__initScroll) return;
  el.__initScroll = true;

  let isDown = false;
  let startX = 0;
  let scrollLeft = 0;

  el.addEventListener('mousedown', e => {
    if (e.target.closest('button') || e.target.closest('a')) return;
    isDown = true;
    el.classList.add('grabbing');
    startX = e.pageX - el.offsetLeft;
    scrollLeft = el.scrollLeft;
  });

  window.addEventListener('mouseup', () => {
    isDown = false;
    if (el) el.classList.remove('grabbing');
  });

  el.addEventListener('mouseleave', () => {
    isDown = false;
    el.classList.remove('grabbing');
  });

  el.addEventListener('mousemove', e => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - el.offsetLeft;
    const walk = (x - startX) * 1.6;
    el.scrollLeft = scrollLeft - walk;
  });

  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    }
  }, { passive: false });
}

window.scrollSignals = function(dir) {
  const el = document.getElementById('signals-scroll');
  if (el) {
    el.scrollBy({ left: dir * 300, behavior: 'smooth' });
  }
};

function printAllDocuments() {
  const main = document.getElementById('main');
  const prevActive = ACTIVE;

  const allSectionsHtml = SECTIONS_UI.map(s => {
    try {
      const meta = NAV_LABELS[s.id] || DATA.meta.sections.find(x => x.id === s.id) || { label_id: s.id, label_en: s.id };
      const label = LANG === 'en' ? meta.label_en : meta.label_id;
      const content = s.build();
      return `<section class="print-page-section" data-print-sec="${s.id}">
        <div class="print-sec-header">
          <span>Joint Market Assessment Flores 2026 — ${esc(label)}</span>
        </div>
        ${content}
      </section>`;
    } catch (e) {
      console.error('Error rendering section for print:', s.id, e);
      return '';
    }
  }).join('');

  main.innerHTML = allSectionsHtml;

  setTimeout(() => {
    window.print();
    setTimeout(() => {
      ACTIVE = prevActive;
      render();
    }, 400);
  }, 350);
}

/* ---------------------------------------------------------------- boot */
(async function boot() {
  initTheme();
  // Opening the multi-file version from file:// leaves fetch() blocked by the
  // browser, which would otherwise look like an endless loading screen.
  // The aggregates are embedded in this file, so a failure here means the file
  // itself arrived truncated. The message says that in both languages, because
  // the loader runs before any language control is available.
  const fail = () => {
    document.getElementById('loader').innerHTML =
      `<div style="max-width:46ch;text-align:left">
         <p style="font-weight:700;margin:0 0 6px;color:var(--ink)">${esc(I18N.id.loadFail)}</p>
         <p style="margin:0 0 14px">${esc(I18N.id.loadHint)}</p>
         <p style="font-weight:700;margin:0 0 6px;color:var(--ink)">${esc(I18N.en.loadFail)}</p>
         <p style="margin:0">${esc(I18N.en.loadHint)}</p>
       </div>`;
  };
  try {
    await loadData();
  } catch (e) {
    fail();
    console.error(e);
    return;
  }
  buildNav();
  buildFilters();
  bindCardActions();
  renderChips();
  applyStaticI18n();
  render();
  initChrome();
  initCovers();

  document.getElementById('btn-reset').addEventListener('click', resetFilters);
  document.getElementById('btn-csv').addEventListener('click', downloadCSV);
  const btnPrint = document.getElementById('btn-print');
  if (btnPrint) btnPrint.addEventListener('click', printAllDocuments);
  document.getElementById('btn-theme').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme === 'dark';
    root.classList.add('theming');
    root.dataset.theme = dark ? 'light' : 'dark';
    localStorage.setItem('jma-theme', dark ? 'light' : 'dark');
    setThemeIcon();
    window.setTimeout(() => root.classList.remove('theming'), 340);
  });
  document.querySelectorAll('.seg [data-lang]').forEach(b => {
    b.addEventListener('click', () => setLang(b.dataset.lang));
  });
  document.getElementById('burger').addEventListener('click', e => {
    if (document.body.classList.contains('sb-collapsed')) { window.jmaSetSb(false); return; }
    const open = document.body.classList.toggle('nav-open');
    e.currentTarget.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', () => closePanels(null));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && OPEN_PANEL) {
      const b = document.querySelector(`.fsel[data-open="${OPEN_PANEL}"]`);
      closePanels(null);
      if (b) b.focus();
    }
  });
  window.addEventListener('hashchange', () => {
    const id = location.hash.replace('#', '');
    if (id && id !== ACTIVE) go(id);
  });
  document.getElementById('loader').classList.add('done');
})();

</script>
